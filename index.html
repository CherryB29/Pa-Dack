        /* ================= 미니맵 ================= */
        const mm = $("#mm"),
          mc = mm.getContext("2d")
        let mmBig = false,
          mmBase = null
        const MMP = 3
        /* 캔버스 내부 해상도를 표시 크기 x 기기 배율에 맞춤 (확대해도 선명하게) */
        function sizeMini() {
          const dpr = save.settings.lowSpec
              ? 1
              : Math.min(window.devicePixelRatio || 1, 3),
            px = Math.round(mm.getBoundingClientRect().width * dpr)
          if (px > 0 && mm.width !== px) mm.width = mm.height = px
        }
        new ResizeObserver(sizeMini).observe(mm)
        sizeMini()
        function buildMini() {
          const c = document.createElement("canvas")
          c.width = c.height = MW * MMP
          const g = c.getContext("2d"),
            im = g.createImageData(MW * MMP, MW * MMP),
            d = im.data
          for (let py = 0; py < MH * MMP; py++)
            for (let px = 0; px < MW * MMP; px++) {
              const gx = (px + 0.5) / MMP,
                gy = (py + 0.5) / MMP,
                f = fld(FW, gx, gy),
                o = (py * MW * MMP + px) * 4
              let r, gg, b
              if (f > 0.5) {
                const sea = fld(FS, gx, gy) / (f + 1e-4) > 0.5,
                  t = clamp((f - 0.5) / 0.35, 0, 1)
                r = sea ? lerp(120, 30, t) : lerp(120, 40, t)
                gg = sea ? lerp(190, 90, t) : lerp(225, 160, t)
                b = sea ? lerp(240, 180, t) : lerp(215, 170, t)
              } else if (f > 0.2) {
                r = 240
                gg = 224
                b = 168
              } else {
                const k = Math.floor(gy) * MW + Math.floor(gx),
                  bc = BCOL[BIO[k]],
                  hh = fld(HT, gx, gy)
                r = bc[0] * 0.82
                gg = bc[1] * 0.85
                b = bc[2] * 0.8
                if (hh > 0.44) {
                  const q = clamp((hh - 0.44) * 3, 0, 1)
                  r = lerp(r, 120, q)
                  gg = lerp(gg, 116, q)
                  b = lerp(b, 108, q)
                }
                const dc = DEC[k]
                if (
                  dc === 1 ||
                  dc === 7 ||
                  dc === 8 ||
                  dc === 9 ||
                  dc === 10 ||
                  dc === 11
                ) {
                  const cc = {
                    1: [44, 140, 70],
                    7: [30, 110, 80],
                    8: [110, 170, 80],
                    9: [220, 120, 50],
                    10: [240, 150, 180],
                    11: [60, 150, 80],
                  }[dc]
                  r = lerp(r, cc[0], 0.7)
                  gg = lerp(gg, cc[1], 0.7)
                  b = lerp(b, cc[2], 0.7)
                }
              }
              d[o] = r
              d[o + 1] = gg
              d[o + 2] = b
              d[o + 3] = 255
            }
          g.putImageData(im, 0, 0)
          for (const p of PIERS) {
            g.fillStyle = "#9a6a3a"
            g.fillRect(p.x * MMP, p.y * MMP, p.w * MMP, p.h * MMP)
          }
          mmBase = c
        }
        buildMini()
        mm.addEventListener("pointerdown", (e) => {
          e.stopPropagation()
          mmBig = !mmBig
          mm.classList.toggle("big", mmBig)
          sfx.tick()
        })
        const MMC = {
          cabin: "#e0553d",
          tent: "#f2a43a",
          lighthouse: "#ffffff",
          windmill: "#f2d9a0",
          well: "#8fb8d8",
          farm: "#c9904a",
          parasol: "#ff6a8a",
          fire: "#ff8a2a",
        }
        function drawMini() {
          const S = mm.width
          mc.setTransform(1, 0, 0, 1, 0, 0)
          mc.clearRect(0, 0, S, S)
          let vx, vy, vw
          if (mmBig) {
            vx = 0
            vy = 0
            vw = MW
          } else {
            vw = 34
            vx = clamp(P.x - vw / 2, 0, MW - vw)
            vy = clamp(P.y - vw / 2, 0, MH - vw)
          }
          mc.imageSmoothingEnabled = true
          mc.drawImage(
            mmBase,
            vx * MMP,
            vy * MMP,
            vw * MMP,
            vw * MMP,
            0,
            0,
            S,
            S,
          )
          const k = S / vw,
            X = (x) => (x - vx) * k,
            Y = (y) => (y - vy) * k
          for (const s of STR) {
            const c = MMC[s.t]
            if (!c) continue
            const x = X(s.cx),
              y = Y(s.cy)
            if (x < 0 || y < 0 || x > S || y > S) continue
            const r = mmBig ? 5 : 6
            mc.fillStyle = "#fff"
            mc.fillRect(x - r / 2 - 1.5, y - r / 2 - 1.5, r + 3, r + 3)
            mc.fillStyle = c
            mc.fillRect(x - r / 2, y - r / 2, r, r)
          }
          for (const q of PORTALS) {
            if (!save.ptl.includes(q.id)) continue
            const x = X(q.x),
              y = Y(q.y)
            if (x < -10 || y < -10 || x > S + 10 || y > S + 10) continue
            const pu = 0.5 + 0.5 * Math.sin(time * 3 + q.id)
            mc.fillStyle = q.c
            mc.globalAlpha = 0.3 + 0.2 * pu
            mc.beginPath()
            mc.arc(x, y, (mmBig ? 11 : 12) + pu * 3, 0, 6.3)
            mc.fill()
            mc.globalAlpha = 1
            mc.fillStyle = "#fff"
            mc.beginPath()
            mc.arc(x, y, mmBig ? 6.4 : 7.2, 0, 6.3)
            mc.fill()
            mc.fillStyle = q.c
            mc.beginPath()
            mc.arc(x, y, mmBig ? 4.4 : 5, 0, 6.3)
            mc.fill()
          }
          for (const k in MP.others) {
            const o = MP.others[k]
            if (o.stale) continue
            const x = X(o.x),
              y = Y(o.y)
            if (x < 0 || y < 0 || x > S || y > S) continue
            mc.fillStyle = "#fff"
            mc.beginPath()
            mc.arc(x, y, 6, 0, 6.3)
            mc.fill()
            mc.fillStyle = "#3b9fd8"
            mc.beginPath()
            mc.arc(x, y, 4, 0, 6.3)
            mc.fill()
          }
          const px = X(P.x),
            py = Y(P.y),
            a = Math.atan2(P.fy, P.fx)
          mc.fillStyle = "rgba(255,138,91,.35)"
          mc.beginPath()
          mc.arc(px, py, 14 + Math.sin(time * 4) * 2, 0, 6.3)
          mc.fill()
          mc.save()
          mc.translate(px, py)
          mc.rotate(a)
          mc.fillStyle = "#fff"
          mc.beginPath()
          mc.moveTo(11, 0)
          mc.lineTo(-6, -7)
          mc.lineTo(-3, 0)
          mc.lineTo(-6, 7)
          mc.closePath()
          mc.fill()
          mc.fillStyle = "#ff6a3a"
          mc.beginPath()
          mc.moveTo(8, 0)
          mc.lineTo(-4, -5)
          mc.lineTo(-2, 0)
          mc.lineTo(-4, 5)
          mc.closePath()
          mc.fill()
          mc.restore()
          if (F.phase === "wait" || F.phase === "bite" || F.phase === "reel") {
            mc.fillStyle = "#fff"
            mc.beginPath()
            mc.arc(X(F.bx), Y(F.by), 3.5, 0, 6.3)
            mc.fill()
            mc.strokeStyle = "#e8453c"
            mc.lineWidth = 2
            mc.stroke()
          }
        }
        /* ================= 유적 포탈 / 지역 연출 ================= */
        const ZLAB = {
          flat: "갯벌",
          swamp: "안개 늪",
          cave: "수중동굴",
          deep: "심해",
        }
        const ptSheet = document.createElement("div")
        ptSheet.id = "ptSheet"
        ptSheet.hidden = true
        document.body.appendChild(ptSheet)
        let nearPt = null,
          tpA = null,
          zoneT = 0,
          zoneNow = ""
        function portalNear() {
          let b = null,
            bd = 1.4
          for (const q of PORTALS) {
            const d = Math.hypot(P.x - q.x, P.y - q.y)
            if (d < bd) {
              bd = d
              b = q
            }
          }
          return b
        }
        function discoverPortal(q) {
          if (save.ptl.includes(q.id)) return
          save.ptl.push(q.id)
          save.gold += 100
          persist()
          updateHud()
          toast(
            "유적 발견! " +
              q.n +
              " · 100G (" +
              save.ptl.length +
              "/" +
              PORTALS.length +
              ")",
            2600,
          )
          sfx.tick && sfx.tick()
          vib(20)
        }
        let pmSel = -1,
          pmTimer = 0
        function pmDraw() {
          const cv = $("#pmC")
          if (!cv || ptSheet.hidden) return
          const S = cv.width,
            g = cv.getContext("2d"),
            t = performance.now() / 1000
          g.clearRect(0, 0, S, S)
          g.imageSmoothingQuality = "high"
          if (mmBase) g.drawImage(mmBase, 0, 0, S, S)
          g.fillStyle = "rgba(6,16,26,.28)"
          g.fillRect(0, 0, S, S)
          const k = S / MW
          for (const q of PORTALS) {
            if (!save.ptl.includes(q.id)) continue
            const x = q.x * k,
              y = q.y * k,
              sel = q.id === pmSel,
              cur = nearPt && q.id === nearPt.id,
              pu = 0.5 + 0.5 * Math.sin(t * 3 + q.id)
            g.fillStyle = q.c
            g.globalAlpha = 0.25 + 0.2 * pu
            g.beginPath()
            g.arc(x, y, (sel ? 22 : 15) + pu * 4, 0, 6.3)
            g.fill()
            g.globalAlpha = 1
            g.fillStyle = q.c
            g.strokeStyle = "#fff"
            g.lineWidth = sel ? 5 : 3.4
            g.beginPath()
            g.arc(x, y, sel ? 10 : 7.5, 0, 6.3)
            g.fill()
            g.stroke()
            if (cur) {
              g.strokeStyle = "rgba(255,255,255,.9)"
              g.lineWidth = 2.4
              g.setLineDash([4, 5])
              g.beginPath()
              g.arc(x, y, 16, 0, 6.3)
              g.stroke()
              g.setLineDash([])
            }
          }
          if (MP.on && MP.user) {
            g.textAlign = "center"
            g.font = '800 19px "Chiron GoRound TC",sans-serif'
            for (const kk in MP.others) {
              const o = MP.others[kk]
              if (o.stale) continue
              const x = o.x * k,
                y = o.y * k,
                tx = Math.min(S - 36, Math.max(36, x)),
                ty = y < 26 ? y + 24 : y - 11
              g.fillStyle = ringCol(o)
              g.strokeStyle = "#fff"
              g.lineWidth = 2.6
              g.beginPath()
              g.arc(x, y, 5.4, 0, 6.3)
              g.fill()
              g.stroke()
              g.lineWidth = 4.5
              g.strokeStyle = "rgba(0,10,20,.75)"
              g.strokeText(o.n, tx, ty)
              g.fillStyle = "#fff"
              g.fillText(o.n, tx, ty)
            }
          }
          g.fillStyle = "#fff"
          g.strokeStyle = "#ff6a3a"
          g.lineWidth = 3
          g.beginPath()
          g.arc(P.x * k, P.y * k, 5.6, 0, 6.3)
          g.fill()
          g.stroke()
          if (MP.on && MP.user) {
            g.textAlign = "center"
            g.font = '800 19px "Chiron GoRound TC",sans-serif'
            const x = P.x * k,
              tx = Math.min(S - 20, Math.max(20, x)),
              ty = P.y * k < 26 ? P.y * k + 24 : P.y * k - 11
            g.lineWidth = 4.5
            g.strokeStyle = "rgba(0,10,20,.75)"
            g.strokeText("나", tx, ty)
            g.fillStyle = "#ffd9a0"
            g.fillText("나", tx, ty)
          }
        }
        function pmInfo() {
          const q = PORTALS.find((z) => z.id === pmSel),
            go = $("#pmGo"),
            inf = $("#pmI")
          if (!q) {
            inf.innerHTML =
              "<b>포탈을 선택해요</b><small>" +
              save.ptl.length +
              " / " +
              PORTALS.length +
              (MP.on && MP.user ? " · 접속 " + (MP.online || 1) + "명" : "") +
              "</small>"
            go.disabled = true
            return
          }
          inf.innerHTML = `<b><i style="background:${q.c}"></i>${q.n}</b><small>${ZLAB[zoneLand(q.x, q.y)] || "육지"}</small>`
          go.disabled = false
        }
        function openPortal() {
          if (!nearPt) return
          pmSel = -1
          ptSheet.innerHTML =
            '<div class="pb"><canvas id="pmC" width="760" height="760"></canvas><div class="pmi" id="pmI"></div><div class="pmb"><button class="btn big" id="pmGo" disabled>이동</button><button class="btn big ghost" id="ptClose">닫기</button></div></div>'
          ptSheet.hidden = false
          pmInfo()
          pmDraw()
          clearInterval(pmTimer)
          pmTimer = setInterval(() => {
            if (ptSheet.hidden) clearInterval(pmTimer)
            else pmDraw()
          }, 50)
          sfx.tick && sfx.tick()
        }
        ptSheet.addEventListener("pointerdown", (e) => e.stopPropagation())
        ptSheet.addEventListener("click", (e) => {
          if (e.target === ptSheet || e.target.id === "ptClose") {
            ptSheet.hidden = true
            return
          }
          if (e.target.id === "pmC") {
            const cv = e.target,
              r = cv.getBoundingClientRect(),
              px = ((e.clientX - r.left) / r.width) * MW,
              py = ((e.clientY - r.top) / r.height) * MH
            let best = null,
              bd = 1e9
            for (const q of PORTALS) {
              if (!save.ptl.includes(q.id) || (nearPt && q.id === nearPt.id))
                continue
              const d = Math.hypot(q.x - px, q.y - py)
              if (d < bd) {
                bd = d
                best = q
              }
            }
            if (best && bd < MW * 0.06) {
              pmSel = best.id
              pmInfo()
              sfx.tick && sfx.tick()
            } else {
              pmSel = -1
              pmInfo()
            }
            return
          }
          if (e.target.id === "pmGo") {
            const q = PORTALS.find((z) => z.id === pmSel)
            if (!q) return
            ptSheet.hidden = true
            tpA = { t: 0, q, done: false }
            vib(30)
            sfx.splash && sfx.splash(0.8)
          }
        })
        function updatePortal(dt) {
          if (tpA) {
            tpA.t += dt
            if (!tpA.done && tpA.t > 0.3) {
              tpA.done = true
              P.x = tpA.q.x
              P.y = tpA.q.y + 2
              P.vx = P.vy = 0
              cam.x = P.x
              cam.y = P.y
              MP.ls = null
              MP.acc = 9
              for (let k = 0; k < 16; k++)
                emit({
                  kind: "d",
                  x: P.x + rnd(-0.4, 0.4),
                  y: P.y,
                  z: 0.1,
                  vz: rnd(0.3, 0.9),
                  vx: rnd(-0.3, 0.3),
                  vy: rnd(-0.2, 0.2),
                  max: 0.9,
                  col: tpA.q.c,
                  sz: rnd(3, 5),
                  g: 0,
                })
              toast(tpA.q.n + " 도착", 1600)
            }
            if (tpA.t > 0.9) tpA = null
          }
          const q = portalNear()
          nearPt = q
          if (q && !tpA && F.phase === "idle") discoverPortal(q)
          zoneT -= dt
          if (zoneT <= 0) {
            zoneT = 0.5
            const z = P.sw
              ? zoneAt(P.x, P.y, isSea(P.x, P.y) ? 1 : 0)
              : zoneLand(P.x, P.y)
            if (z !== zoneNow) {
              zoneNow = z
              if (z) toast(ZLAB[z], 1800)
            }
          }
        }
        const amb = { s: 0, c: 0, f: 0, d: 0 }
        function drawZoneAmbient() {
          const cx = cam.x,
            cy = cam.y,
            k = 0.06
          amb.s += (clamp(fld(ZS, cx, cy) * 2.2, 0, 1) - amb.s) * k
          amb.c += (clamp(fld(ZC, cx, cy) * 2.2, 0, 1) - amb.c) * k
          amb.f += (clamp(fld(ZF, cx, cy) * 2.2, 0, 1) - amb.f) * k
          amb.d += (clamp((fld(ZD, cx, cy) - 0.2) * 2, 0, 1) - amb.d) * k
          const s = TS / 48
          if (amb.s > 0.02) {
            ctx.fillStyle = `rgba(70,115,80,${0.14 * amb.s})`
            ctx.fillRect(0, 0, W, H)
            for (let i = 0; i < 5; i++) {
              const fx =
                  ((time * 0.012 * (1 + i * 0.3) + i * 0.37) % 1) * (W + 300) -
                  150,
                fy = H * (0.15 + 0.17 * i) + Math.sin(time * 0.3 + i) * 20,
                g = ctx.createRadialGradient(fx, fy, 0, fx, fy, 190 * s)
              g.addColorStop(0, `rgba(220,240,215,${0.2 * amb.s})`)
              g.addColorStop(1, "rgba(220,240,215,0)")
              ctx.fillStyle = g
              ctx.fillRect(fx - 200 * s, fy - 200 * s, 400 * s, 400 * s)
            }
            for (let i = 0; i < 20; i++) {
              const fx =
                  (hash(i, 1, 71) * W + Math.sin(time * 0.5 + i) * 30 * s + W) %
                  W,
                fy =
                  (hash(i, 2, 72) * H +
                    Math.cos(time * 0.4 + i * 1.3) * 24 * s +
                    H) %
                  H,
                a = Math.max(0, Math.sin(time * 1.6 + i * 2.1)) * amb.s
              if (a < 0.05) continue
              const g = ctx.createRadialGradient(fx, fy, 0, fx, fy, 9 * s)
              g.addColorStop(0, `rgba(230,255,130,${a})`)
              g.addColorStop(1, "rgba(230,255,130,0)")
              ctx.fillStyle = g
              ctx.fillRect(fx - 9 * s, fy - 9 * s, 18 * s, 18 * s)
            }
          }
          if (amb.c > 0.02) {
            const g = ctx.createRadialGradient(
              W / 2,
              H * 0.5,
              Math.min(W, H) * 0.25,
              W / 2,
              H * 0.5,
              Math.max(W, H) * 0.75,
            )
            g.addColorStop(0, "rgba(10,20,50,0)")
            g.addColorStop(1, `rgba(4,8,30,${0.62 * amb.c})`)
            ctx.fillStyle = g
            ctx.fillRect(0, 0, W, H)
            ctx.fillStyle = `rgba(40,60,140,${0.08 * amb.c})`
            ctx.fillRect(0, 0, W, H)
            for (let i = 0; i < 24; i++) {
              const fx =
                  (hash(i, 3, 73) * W + Math.sin(time * 0.4 + i) * 20 * s + W) %
                  W,
                fy =
                  (((hash(i, 4, 74) * H -
                    time * 8 * s * (0.5 + hash(i, 5, 75))) %
                    H) +
                    H) %
                  H,
                a = (0.4 + 0.4 * Math.sin(time * 1.8 + i)) * amb.c
              ctx.fillStyle =
                i % 3 ? `rgba(140,235,255,${a})` : `rgba(230,170,255,${a})`
              ctx.beginPath()
              ctx.arc(fx, fy, (1.4 + hash(i, 6, 76) * 1.6) * s, 0, 6.3)
              ctx.fill()
            }
          }
          if (amb.f > 0.02) {
            ctx.fillStyle = `rgba(240,232,210,${0.12 * amb.f})`
            ctx.fillRect(0, 0, W, H)
            for (let i = 0; i < 4; i++) {
              const fx =
                  ((time * 0.02 * (1 + i * 0.4) + i * 0.29) % 1) * (W + 300) -
                  150,
                fy = H * (0.25 + 0.2 * i),
                g = ctx.createRadialGradient(fx, fy, 0, fx, fy, 170 * s)
              g.addColorStop(0, `rgba(255,250,235,${0.22 * amb.f})`)
              g.addColorStop(1, "rgba(255,250,235,0)")
              ctx.fillStyle = g
              ctx.fillRect(fx - 180 * s, fy - 180 * s, 360 * s, 360 * s)
            }
          }
          if (amb.d > 0.02) {
            ctx.fillStyle = `rgba(0,12,60,${0.34 * amb.d})`
            ctx.fillRect(0, 0, W, H)
            ctx.fillStyle = `rgba(150,200,255,${0.05 * amb.d})`
            for (let i = 0; i < 4; i++) {
              const x0 =
                W * (0.1 + 0.25 * i) + Math.sin(time * 0.3 + i) * 30 * s
              ctx.beginPath()
              ctx.moveTo(x0, 0)
              ctx.lineTo(x0 + 90 * s, 0)
              ctx.lineTo(x0 + 260 * s, H)
              ctx.lineTo(x0 + 120 * s, H)
              ctx.closePath()
              ctx.fill()
            }
            for (let i = 0; i < 16; i++) {
              const fx =
                  (hash(i, 7, 77) * W + Math.sin(time * 0.8 + i) * 10 * s + W) %
                  W,
                fy =
                  (((hash(i, 8, 78) * H -
                    time * 30 * s * (0.4 + hash(i, 9, 79))) %
                    H) +
                    H) %
                  H
              ctx.strokeStyle = `rgba(200,230,255,${0.5 * amb.d})`
              ctx.lineWidth = 1.2 * s
              ctx.beginPath()
              ctx.arc(fx, fy, (2 + hash(i, 10, 80) * 3) * s, 0, 6.3)
              ctx.stroke()
            }
          }
          if (tpA) {
            const a = Math.sin(Math.min(1, tpA.t / 0.9) * Math.PI)
            ctx.fillStyle = tpA.q.c
            ctx.globalAlpha = a * 0.55
            ctx.fillRect(0, 0, W, H)
            ctx.fillStyle = "#fff"
            ctx.globalAlpha = a * 0.7
            ctx.fillRect(0, 0, W, H)
            ctx.globalAlpha = 1
          }
        }
        let nearNow = null
        function drawIt(it) {
          const o =
            (it.k === 0
              ? hOffT(P.x, P.y)
              : it.k === "O"
                ? hOffT(it.o.x, it.o.y)
                : it.k === "S"
                  ? hOffT(it.s.cx, it.s.cy)
                  : it.k === "W"
                    ? 0
                    : hOffT(it.x + 0.5, it.y + 0.9)) * TS
          if (o > 0.4) {
            ctx.save()
            ctx.translate(0, -o)
            it.k === 0 ? drawPlayer() : drawItem(it)
            ctx.restore()
          } else it.k === 0 ? drawPlayer() : drawItem(it)
        }
        function render() {
          const x0 = Math.floor(cam.x - W / 2 / TS) - 1,
            x1 = Math.ceil(cam.x + W / 2 / TS) + 1,
            y0 = Math.floor(cam.y - H / 2 / TS) - 1,
            y1 = Math.ceil(cam.y + H / 2 / TS) + 2

        const yieldFrame = () =>
          new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0)))
        let renderTok = 0
        /* 아이콘 작업 단위: has() 로 이미 캐시됐는지 확인, make() 로 생성 */
        const iconJob = (f, px, sil) => {
          const k = f.id + "|" + px + "|" + sil
          return {
            has: () => !!(iconCache[k] || iconStore["i:" + k]),
            make: () => iconURL(f, px, sil),
          }
        }
        const gearJob = (id, px, sil) => {
          const k = id + "|" + px + "|" + sil
          return {
            has: () => !!(gearCache[k] || iconStore["g:" + k]),
            make: () => gearURL(id, px, sil),
          }
        }
        /* 미생성 아이콘이 있을 때만 스켈레톤을 보이고, 청크로 만든 뒤 실제 렌더 */
        async function renderTab(taskFn, render, skel) {
          const tok = ++renderTok
          const pending = taskFn().filter((j) => !j.has())
          if (!pending.length) {
            render()
            return
          }
          if (skel) skel()
          await yieldFrame()
          for (let i = 0; i < pending.length && tok === renderTok; i += 3) {
            pending.slice(i, i + 3).forEach((j) => j.make())
            await yieldFrame()
          }
          if (tok === renderTok) render()
        }

          if (pity >= PITY - 1) return Math.random() < 0.2 ? 4 : 3
          let tot = 0
          const ws = RORD.map((r) => {
            tot += RAR[r].w
            return RAR[r].w
          })
          let x = Math.random() * tot,
            ri = 0
          for (; ri < 4; ri++) {

            x -= ws[ri]
          }
          if (guar && ri < 2) ri = 2
          return ri

          for (let i = 0; i < n; i++) {

        function mpInit() {
          if (!FIREBASE_CONFIG.apiKey || !FIREBASE_CONFIG.databaseURL) {
            mpUI()

          }
          let tries = 0
          const iv = setInterval(() => {
            if (window.firebase && firebase.database && firebase.auth) {

                MP.auth.onAuthStateChanged(onAuth)
              } catch (e) {
                console.warn(e)
                MP.err = "초기화 실패"
                mpUI()
              }
            } else if (++tries > 50) {
              clearInterval(iv)
              MP.err = "Firebase SDK를 불러오지 못했어요 (인터넷 확인)"
              mpUI()
            }
          }, 200)
        }
        let authSeq = 0,

        function resetPlayState() {

          } catch (e) {}
        }
        async function onAuth(u) {
          const seq = ++authSeq
          clearTimeout(cloudT)
          clearTimeout(retryT)
          const prev = MP.user
          MP.ready = false
          MP.sUid = null
          if (!u) {
            MP.user = null
            leaveWorld()
            MP.ban = null
            MP.maint = false
            syncBlock()
            /* 계정 진행은 메모리에서 비우고 오프라인 저장으로 되돌린다 */
            if (prev) {
              save = readOffline()
              resetPlayState()
              applySaveUI()
            }
            if (!MP.skip) $("#login").hidden = false
            mpUI()
            return
          }
          if (prev && prev.uid !== u.uid) {
            leaveWorld()
            save = readOffline()
            resetPlayState()
          }
          MP.user = u
          $("#login").hidden = true
          MP.skip = false
          const ok = await loadCloud(u, seq)
          if (seq !== authSeq) return
          if (ok) joinWorld()
          else {
            toast("계정 정보를 불러오지 못했어요. 다시 시도해요")
            retryT = setTimeout(() => {
              if (seq === authSeq && MP.user === u) onAuth(u)
            }, 5000)
          }
          mpUI()
        }
        const dispName = () => save.nick || "낚시꾼"
        async function loadCloud(u, seq) {
          try {
            const snap = await MP.db
                .ref("users/" + u.uid + "/save")
                .once("value"),
              c = snap.val()
            if (seq !== authSeq) return false
            if (c) {
              save = Object.assign(defaultSave(), c)
              if (!Array.isArray(save.inv))
                save.inv = Object.values(save.inv || {})
              /* 예전 버전이 남긴 같은 계정의 오프라인 기록이면 비운다 */
              const off = readOffline()
              if (off.nick && off.nick === save.nick)
                try {
                  localStorage.removeItem(SAVE_KEY)
                } catch (e) {}
            } else {
              /* 새 계정: 오프라인으로 하던 진행을 한 번만 이어받고 오프라인 슬롯은 비운다 */
              save = readOffline()

              if (!save.nick) {
                save.nick =

                console.warn(e)

              if (seq !== authSeq) return false

            MP.sUid = u.uid
            MP.ready = true
            try {
              localStorage.setItem(ukey(u.uid), JSON.stringify(save))
            } catch (e) {}
            resetPlayState()
            await cloudSaveNow()
            applySaveUI()
            return true
          } catch (e) {
            console.warn(e)
            return false
          }

          if (!MP.on || !MP.user || !MP.ready || MP.sUid !== MP.user.uid)

          const u = MP.user.uid
          const pr = MP.db

            if (!atBottom) l.scrollTop -= h // 보고 있던 내용이 밀리지 않도록 보정
          }
          if (!atBottom && !own) {
            chatUnread++
          }
          if (atBottom || own) {
            l.scrollTop = l.scrollHeight
            clearUnread()
          }
          renderNew()
          if (isChatOpen()) return
          showLog()
          scheduleLogFade() // 새 메시지: 보이게 하고 타이머 (재)시작
        }
        function addLine(name, text, cls, own) {
          const d = document.createElement("div")
          d.className = "cl" + (cls ? " " + cls : "")
          const nk = document.createElement("span")
          nk.className = "nk"
          nk.textContent = String(name || "낚시꾼")
          const ms = document.createElement("span")
          ms.className = "ms"
          ms.textContent = ": " + text
          d.append(nk, ms)
          pushLine(d, own)
        }
        function addNotice(text) {
          const d = document.createElement("div")
          d.className = "cl notice"
          d.textContent = "[공지] " + String(text)
          pushLine(d)
        }
        function addSys(text) {
          const d = document.createElement("div")
          d.className = "cl sys"
          d.textContent = String(text)
          pushLine(d)
        }
        const chatDock = $("#chatDock"),
          chatRow = $("#chatInputRow"),
          chatIn = $("#chatIn"),
          chatOpenBtn = $("#chatOpen"),
          chatSendBtn = $("#chatSend"),
          chatLogEl = $("#chatLog")
        let chatManual = false // 수동(버튼/로그 클릭)으로 펼쳤는지
        let chatOpenT = 0
        /* 입력창 펼침: 로그 전체를 보이게 하고 타이머 중지 */
        function openChat(focus, manual) {
          chatRow.classList.add("open")
          chatDock.classList.add("expanded")
          chatManual = !!manual
          chatOpenT = performance.now()
          showLog()
          if (focus) chatIn.focus()
        }
        /* reason: 'send' | 'esc' | 'other'(외부 행동) */
        function closeChat(reason) {
          if (!isChatOpen()) return
          if (reason === "other" && performance.now() - chatOpenT < 300) return
          chatRow.classList.remove("open")
          chatDock.classList.remove("expanded") // 먼저 접고 나서 blur 처리
          if (document.activeElement === chatIn) chatIn.blur()
          showLog()
          scheduleLogFade() // 접힌 시점부터 페이드 타이머 시작 (수동/일반 동일)
          chatManual = false
        }
        function sendNow() {
          const v = chatIn.value.trim()
          if (v) mpSay(v)
          chatIn.value = ""
          closeChat("send")
        }
        /* 단축어: 기본 4개 + 직접 추가 최대 4개 (계정 저장에 포함) */
        const QDEF = ["안녕하세요", "대물이다!", "고마워요", "바이바이"],
          QMAX = 4,
          chatQ = $("#chatQ")
        const getQ = () =>
          Array.isArray(save.chips)
            ? save.chips.filter((x) => typeof x === "string").slice(0, QMAX)
            : []
        function qBtn(txt, cls) {
          const b = document.createElement("button")
          b.type = "button"
          b.className = "qc" + (cls ? " " + cls : "")
          b.addEventListener("mousedown", (e) => e.preventDefault())
          b.addEventListener("pointerdown", (e) => e.stopPropagation())
          if (txt != null) {
            const sp = document.createElement("span")
            sp.textContent = txt
            b.appendChild(sp)
          }
          return b
        }
        function renderQ() {
          chatQ.innerHTML = ""
          const say = (t) => {
            mpSay(t)
            closeChat("send")
            sfx.tick()
          }
          QDEF.forEach((t) => {
            const b = qBtn(t)
            b.addEventListener("click", () => say(t))
            chatQ.appendChild(b)
          })
          getQ().forEach((t, i) => {
            const b = qBtn(t, "cu")
            b.addEventListener("click", () => say(t))
            const x = document.createElement("span")
            x.className = "qx"
            x.textContent = "×"
            x.addEventListener("click", (e) => {
              e.stopPropagation()
              const a = getQ()
              a.splice(i, 1)
              save.chips = a
              persist()
              renderQ()
            })
            b.appendChild(x)
            chatQ.appendChild(b)
          })
          if (getQ().length < QMAX) {
            const b = qBtn("+", "add")
            b.setAttribute("aria-label", "입력한 문구를 단축어로 추가")
            b.addEventListener("click", () => {
              const v = chatIn.value.trim().slice(0, 20)
              if (!v) {
                toast("입력창에 문구를 적고 + 를 눌러요")
                return
              }
              const a = getQ()
              if (QDEF.includes(v) || a.includes(v)) {
                toast("이미 있는 단축어예요")
                return
              }
              a.push(v)
              save.chips = a
              chatIn.value = ""
              persist()
              renderQ()
            })
            chatQ.appendChild(b)
          }
        }
        renderQ()
        chatIn.addEventListener("blur", () => closeChat("other"))
        chatIn.addEventListener("pointerdown", (e) => e.stopPropagation())
        chatIn.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.isComposing) {
            e.preventDefault()
            sendNow()
          } else if (e.key === "Escape") {
            e.preventDefault()
            closeChat("esc")
          }
        })
        /* 로그를 누르면 입력창을 포커스 없이 펼침 (페이드 중이어도 정상 투명도로 복귀) */
        /* 모바일/데스크톱 공통: 드래그로 로그 스크롤 (브라우저 기본 스크롤은 touch-action:none으로 끔) */
        let clDrag = null
        chatLogEl.addEventListener("scroll", () => {
          if (nearBottom(chatLogEl)) clearUnread()
        })
        const chatNewBtn = document.getElementById("chatNew")
        chatNewBtn.addEventListener("mousedown", (e) => e.preventDefault())
        chatNewBtn.addEventListener("pointerdown", (e) => {
          e.preventDefault()
          e.stopPropagation()
          jumpToBottom()
        })
        chatLogEl.addEventListener("pointerdown", (e) => {
          e.stopPropagation()
          clDrag = { id: e.pointerId, y: e.clientY }
          try {
            chatLogEl.setPointerCapture(e.pointerId)
          } catch (_) {}
          if (!isChatOpen()) openChat(false, true)
        })
        chatLogEl.addEventListener("pointermove", (e) => {
          if (!clDrag || e.pointerId !== clDrag.id) return
          chatLogEl.scrollTop -= e.clientY - clDrag.y
          clDrag.y = e.clientY
        })
        const endLogDrag = (e) => {
          if (clDrag && e.pointerId === clDrag.id) clDrag = null
        }
        chatLogEl.addEventListener("pointerup", endLogDrag)
        chatLogEl.addEventListener("pointercancel", endLogDrag)
        /* 펼쳐진 상태에서 입력창 밖을 누르면 외부 행동으로 보고 접음 */
        addEventListener(
          "pointerdown",
          (e) => {
            if (isChatOpen() && !chatDock.contains(e.target)) closeChat("other")
          },
          true,
        )
        chatOpenBtn.addEventListener("mousedown", (e) => e.preventDefault())
        chatOpenBtn.addEventListener("pointerdown", (e) => e.stopPropagation())
        chatOpenBtn.addEventListener("click", () => {
          openChat(true, true)
          sfx.tick()
        })
        chatSendBtn.addEventListener("mousedown", (e) => e.preventDefault())
        chatSendBtn.addEventListener("pointerdown", (e) => {
          e.preventDefault()
          e.stopPropagation()
          sendNow()
          sfx.tick()
        })
        addEventListener("keydown", (e) => {
          if (
            e.key.toLowerCase() !== "t" ||
            e.isComposing ||
            (e.target && e.target.tagName === "INPUT")
          )
            return
          e.preventDefault()
          keys.delete("t")
          openChat(true, false)
        })
        /* 랭킹 */
        async function renderRank() {
          const box = $("#rankList")
          if (!(MP.on && MP.user)) {
            box.innerHTML =
              '<div class="rk0">로그인하면 전체 랭킹을 볼 수 있어요</div>'
            return
          }
          box.innerHTML = '<div class="rk0"><div class="spin"></div></div>'
          try {
            const sn = await MP.db
                .ref("leaderboard")
                .orderByChild("earned")
                .limitToLast(30)
                .once("value"),
              arr = []
            sn.forEach((c) => {
              arr.push(Object.assign({ k: c.key }, c.val()))
            })
            arr.reverse()
            box.innerHTML = arr.length
              ? arr
                  .map(
                    (r, i) =>
                      `<div class="rk ${r.k === MP.user.uid ? "me" : ""}"><b class="rn">${i + 1}</b><img src="${avUrl(AVS[(r.avatar | 0) % AVS.length])}" alt="" onerror="this.style.visibility='hidden'"><div class="rg"><span>${String(r.nick || "낚시꾼").replace(/[<>&]/g, "")}</span><small>도감 ${r.dex || 0}/${FISH.length}</small></div><div class="rc">${ICON.coin}${(r.earned || 0).toLocaleString()}</div></div>`,
                  )
                  .join("")
              : '<div class="rk0">아직 기록이 없어요</div>'
          } catch (e) {
            box.innerHTML = '<div class="rk0">랭킹을 불러오지 못했어요</div>'
          }
        }
        const sDrag = $("#setDrag")
        sDrag.checked = save.settings.drag !== false
        sDrag.addEventListener("change", () => {
          save.settings.drag = sDrag.checked
          persist()
          MP.acc = 9
        })
        /* 저사양 모드 적용: 블러 제거(CSS 속성), 캔버스 해상도 낮춤(resize) */
        const applyLowSpec = () => {
          document.documentElement.toggleAttribute(
            "data-lowspec",
            !!save.settings.lowSpec,
          )
          resize()
        }
        const sLow = $("#setLow")
        sLow.checked = !!save.settings.lowSpec
        applyLowSpec()
        sLow.addEventListener("change", () => {
          save.settings.lowSpec = sLow.checked
          persist()
          applyLowSpec()
        })
        mpInit()

        window.__game = {
          showPullResult,
          DEC,
          SOLID,
          mpLeave,
          recalcGear,
          get MP() {
            return MP
          },
          fullMapCanvas,
          CHK,
          get HT() {
            return HT
          },
          rollFish,
          ZN,
          wAt,
          isW,
          STRX: STR,
          zoneAt,
          zoneLand,
          PORTALS,
          ZD,
          ZF,
          ZS,
          ZC,
          ITEMS,
          gearURL,
          iconURL,
          get R() {
            return R
          },
          get F() {
            return F
          },
          FISH,
          drawArt,
          get P() {
            return P
          },
          get save() {
            return save
          },
          setTab,
          renderShop,
          STR,
          PIERS,
        }
        /* ================= 메인 루프 ================= */
        /* 로딩 중 랜덤 메시지 */
        const LOAD_TIPS = [
          "낚싯대 준비하는 중...",
          "준비 운동 하는 중...",
          "물고기 먹이 준비하는 중...",
          "주디 덕질 중...",
          "찌 점검하는 중...",
          "미끼 고르는 중...",
          "바다 날씨 살피는 중...",
        ]
        {
          const lp = document.querySelector("#loader p")
          if (lp)
            lp.textContent =
              LOAD_TIPS[Math.floor(Math.random() * LOAD_TIPS.length)]
        }
        let last = performance.now(),
          loaded = false
        function loop(now) {
          const dt = Math.min(0.05, (now - last) / 1000)
          last = now
          if (W > 10) {
            update(dt)
            updateHud2()
            render()
            if (!loaded) {
              loaded = true
              const l = document.getElementById("loader")
              if (l) l.remove()
            }
          }
          requestAnimationFrame(loop)
        }
        fillIcons()
        /* 선택 인디케이터: 선택된 탭 위치로 미끄러지듯 이동 */
        function moveNavPill(first) {
          const nav = document.getElementById("nav"),
            pill = document.getElementById("navPill"),
            on = nav && nav.querySelector(".tab.on")
          if (!pill) return
          if (!on) {
            pill.classList.add("off")
            return
          }
          const appear = first || pill.classList.contains("off")
          const nr = nav.getBoundingClientRect(),
            tr = on.getBoundingClientRect()
          // 등장 시에는 위치를 즉시 맞춘 뒤 scale/fade 로 나타남
          if (appear) pill.style.transition = "none"
          pill.style.left = Math.round(tr.left - nr.left) + "px"
          pill.style.width = Math.round(tr.width) + "px"
          if (appear) {
            void pill.offsetWidth
            pill.style.transition = ""
            pill.classList.remove("off")
          }
        }
        resize()
        setTimeout(prewarmIcons, 1500)
        updateHud()
        ghostJoy()
        moveNavPill(true)
        elAI.innerHTML = ICON.rod
        requestAnimationFrame(loop)
        window.addEventListener("resize", () => {
          ghostJoy()
          moveNavPill(true)
        })
      }
      requestAnimationFrame(() => setTimeout(__start, 60))
    </script>
  </body>
</html>
