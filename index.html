<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f6">
<title>Animal Brawl</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --bg:#f2f4f6; --card:#fff; --ink:#191f28; --ink2:#4e5968; --ink3:#8b95a1; --ink4:#b0b8c1; --line:#e8ebee;
    --blue:#3182f6; --blue-d:#1b64da; --blue-s:#e8f3ff; --red:#f04452; --red-s:#ffeceb; --green:#03b26c; --gold:#f2a50c;
  }
  * { box-sizing: border-box; }
  html, body { font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif; background:#dde1e6; color:var(--ink); -webkit-tap-highlight-color:transparent; overscroll-behavior:none; letter-spacing:-0.012em; }
  body { user-select:none; -webkit-user-select:none; font-feature-settings:'tnum' 1; }
  button { font-family:inherit; letter-spacing:inherit; }
  .emoji { font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; letter-spacing:0; }
  #app { background:var(--bg); }

  /* ───────── 등급 팔레트 ───────── */
  .t-n { --t:#7b8794; --ts:#eef1f4; --tm:#d5dae0; --tg:rgba(123,135,148,.25); }
  .t-r { --t:#2f7cf0; --ts:#e6f1ff; --tm:#a9cbfa; --tg:rgba(47,124,240,.28); }
  .t-e { --t:#7a4de0; --ts:#f0eaff; --tm:#c8b5f5; --tg:rgba(122,77,224,.30); }
  .t-m { --t:#e5424e; --ts:#ffebed; --tm:#f5adb2; --tg:rgba(229,66,78,.32); }
  .t-l { --t:#e98a00; --ts:#fff2d6; --tm:#f4cc80; --tg:rgba(233,138,0,.36); }
  .t-t { --t:#c93fb0; --ts:#fdeaf8; --tm:#eba5dc; --tg:rgba(201,63,176,.40); }
  .tc { color:var(--t); }
  .chip { display:inline-flex; align-items:center; gap:4px; height:22px; padding:0 9px; border-radius:99px; font-size:11px; font-weight:700; background:var(--ts); color:var(--t); }
  .chip.neutral { background:#f2f4f6; color:var(--ink2); }
  .chip.dark { background:rgba(255,255,255,.14); color:#fff; }

  /* 메달(캐릭터 받침) */
  .medal { display:flex; align-items:center; justify-content:center; border-radius:50%; position:relative;
    background:radial-gradient(circle at 50% 30%, #fff 0, var(--ts) 55%, var(--tm) 130%); box-shadow:inset 0 0 0 1.5px var(--tm), 0 6px 14px -6px var(--tg); }
  .medal > span { text-shadow:0 3px 3px rgba(25,31,40,.22); line-height:1; }

  /* 타일 */
  .evo-bang { position:absolute; top:-7px; right:-5px; width:21px; height:21px; border-radius:50%; background:#f04452; color:#fff; font-size:13px; font-weight:900; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 2px #fff, 0 3px 8px rgba(240,68,82,.5); animation:bangPulse 1.1s ease-in-out infinite; z-index:3; pointer-events:none; }
  @keyframes bangPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.2); } }
  .tile { position:relative; border-radius:18px; background:linear-gradient(180deg,var(--ts) 0,#fff 78%); box-shadow:inset 0 0 0 1.5px var(--tm); transition:transform .14s ease, box-shadow .14s ease; }
  .tile.eq { box-shadow:inset 0 0 0 2px var(--ink); }
  .tile.sel { box-shadow:inset 0 0 0 2.5px var(--blue), 0 0 0 4px rgba(49,130,246,.18); }
  .tile.focus { animation:focusRing 1.3s ease-out; }
  @keyframes focusRing { 0%{ box-shadow:inset 0 0 0 2.5px var(--blue),0 0 0 0 rgba(49,130,246,.75); } 100%{ box-shadow:inset 0 0 0 2.5px var(--blue),0 0 0 16px rgba(49,130,246,0); } }
  .tile.locked { background:#f2f4f6; box-shadow:inset 0 0 0 1.5px #e5e8eb; }
  .tile.hi-m, .tile.hi-l { box-shadow:inset 0 0 0 1.5px var(--tm), 0 8px 18px -10px var(--t); }
  .holo { position:relative; }
  .holo::before { content:''; position:absolute; inset:0; border-radius:inherit; padding:2px; pointer-events:none;
    background:conic-gradient(#ff7eb3,#ffd86b,#6bf0c4,#6bb7ff,#c58bff,#ff7eb3);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; animation:hue 5s linear infinite; }
  @keyframes hue { to { filter:hue-rotate(360deg); } }

  /* 카드/버튼 */
  .card { background:var(--card); border-radius:24px; padding:20px; }
  .soft { box-shadow:0 1px 0 rgba(25,31,40,.03), 0 10px 28px -16px rgba(25,31,40,.18); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:48px; padding:0 18px; border-radius:16px; font-weight:700; font-size:15px; border:0; cursor:pointer; transition:transform .12s ease, background .15s ease, opacity .15s; }
  .btn:active { transform:scale(.97); }
  .btn.primary { background:var(--blue); color:#fff; }
  .btn.primary:active { background:var(--blue-d); }
  .btn.ghost { background:#f2f4f6; color:var(--ink2); }
  .btn.danger { background:var(--red-s); color:var(--red); }
  .btn.sm { height:36px; padding:0 14px; font-size:13px; border-radius:12px; }
  .btn:disabled { opacity:.4; }
  .press { transition:transform .12s ease; }
  .press:active { transform:scale(.96); }
  .bar { height:6px; border-radius:99px; background:#eceff2; overflow:hidden; }
  .bar > i { display:block; height:100%; border-radius:99px; background:var(--blue); transition:width .4s cubic-bezier(.2,.8,.2,1); }
  .coin { width:1.05em; height:1.05em; flex:none; vertical-align:-0.16em; }
  .seg { display:flex; padding:4px; border-radius:16px; background:#eceff2; }
  .seg button { flex:1; height:38px; border-radius:12px; font-weight:700; font-size:14px; color:var(--ink3); border:0; background:transparent; transition:all .18s; }
  .seg button.on { background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(25,31,40,.12); }
  .sect { font-size:13px; font-weight:700; color:var(--ink3); margin-bottom:10px; letter-spacing:0; }

  /* 네비게이션 */
  .navbtn { position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 0 8px; color:var(--ink4); font-size:11px; font-weight:700; border:0; background:none; transition:color .18s; }
  .navbtn.on { color:var(--ink); }
  .tour-hl { position:relative; z-index:2; outline:3px solid var(--blue); outline-offset:3px; border-radius:16px; box-shadow:0 0 0 8px rgba(49,130,246,.22); transition:box-shadow .3s; }
  .navbtn .ndot { position:absolute; top:7px; left:50%; margin-left:7px; width:9px; height:9px; border-radius:50%; background:var(--red); box-shadow:0 0 0 2px #fff; }
  .navbtn.on::before { content:''; position:absolute; top:0; left:50%; width:22px; height:3px; margin-left:-11px; border-radius:0 0 4px 4px; background:var(--blue); }
  .navbtn.on i, .navbtn.on svg { color:var(--blue); }

  /* 애니메이션 */
  @keyframes popIn { 0% { transform:scale(.55) translateY(14px); opacity:0; } 60% { transform:scale(1.04); opacity:1; } 100% { transform:none; } }
  @keyframes slideUp { from { transform:translateY(14px); opacity:0; } to { transform:none; opacity:1; } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes fadeOut { from { opacity:1; } to { opacity:0; } }
  @keyframes flipIn { 0% { transform:perspective(500px) rotateY(80deg) scale(.7); opacity:0; } 100% { transform:none; opacity:1; } }
  .att-pal { position:absolute; bottom:4px; left:2%; font-size:17px; animation:attRun linear infinite; }
  @keyframes attRun { 0% { left:2%; transform:scaleX(-1); } 48% { left:calc(100% - 26px); transform:scaleX(-1); } 50% { left:calc(100% - 26px); transform:scaleX(1); } 98% { left:2%; transform:scaleX(1); } 100% { left:2%; transform:scaleX(-1); } }
  .attHop { animation:attHopK ease-in-out infinite; } @keyframes attHopK { 0%,100% { transform:translateY(0) scaleY(.93); } 45% { transform:translateY(calc(var(--h) * -1)) scaleY(1.04); } 55% { transform:translateY(calc(var(--h) * -1)) scaleY(1.04); } }
  .attWob { animation:attWobK ease-in-out infinite; } @keyframes attWobK { 0%,100% { transform:translateY(0) rotate(-7deg); } 50% { transform:translateY(calc(var(--h) * -1)) rotate(7deg); } }
  @keyframes rise { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(49,130,246,.35); } 50% { box-shadow:0 0 0 7px rgba(49,130,246,0); } }
  @keyframes spinSlow { to { transform:rotate(360deg); } }
  @keyframes loadBar { from { width:0%; } to { width:100%; } }
  @keyframes letterIn { 0% { transform:translateY(18px); opacity:0; } 100% { transform:none; opacity:1; } }
  @keyframes lvUp { 0% { transform:scale(.6); opacity:0; } 60% { transform:scale(1.12); opacity:1; } 100% { transform:scale(1); } }
  .dc-shine { position:absolute; top:-20%; bottom:-20%; left:-60%; width:45%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.9),transparent); transform:translateX(0) skewX(-18deg); opacity:0; }
  .g-wrap { position:relative; width:100%; height:420px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; }
  .g-stage { position:relative; width:200px; height:200px; display:flex; align-items:center; justify-content:center; }
  .g-card { position:relative; width:108px; height:148px; border-radius:26px; background:linear-gradient(160deg,var(--tm),var(--t)); display:flex; align-items:center; justify-content:center; font-size:54px; font-weight:800; color:rgba(255,255,255,.92); animation:gFloat 2.2s ease-in-out infinite, gGlow var(--gd) ease-in both; }
  .g-prog { position:absolute; inset:0; width:200px; height:200px; transform:rotate(-90deg); }
  .g-prog circle { fill:none; stroke-width:3; }
  .g-prog .tr { stroke:rgba(255,255,255,.12); }
  .g-prog .fg { stroke:var(--t); stroke-linecap:round; stroke-dasharray:578; animation:gProg var(--gd) linear both; }
  .g-hint { margin-top:30px; font-size:13px; font-weight:700; color:rgba(255,255,255,.72); padding:9px 16px; border-radius:99px; background:rgba(255,255,255,.12); letter-spacing:-0.01em; }
  .g-burst { position:fixed; left:50%; top:42%; width:0; height:0; pointer-events:none; z-index:95; }
  .g-p { position:absolute; left:-4px; top:-4px; width:8px; height:8px; border-radius:50%; background:var(--t); animation:gP 1.3s cubic-bezier(.15,.7,.3,1) both; }
  @keyframes gFloat { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-7px); } }
  @keyframes gGlow { 0% { box-shadow:0 12px 26px -16px var(--t); } 100% { box-shadow:0 0 60px 4px var(--t); } }
  @keyframes gProg { from { stroke-dashoffset:578; } to { stroke-dashoffset:0; } }
  @keyframes gP { 0% { transform:translate(0,0) scale(1); opacity:.9; } 100% { transform:translate(var(--dx),var(--dy)) scale(.3); opacity:0; } }
  input.vol { -webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:99px; outline:none; margin:10px 0 4px; background:linear-gradient(to right,var(--blue) var(--p,50%),#e5e8eb var(--p,50%)); }
  input.vol::-webkit-slider-thumb { -webkit-appearance:none; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 5px rgba(0,0,0,.28); border:0; }
  input.vol::-moz-range-thumb { width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 5px rgba(0,0,0,.28); border:0; }
  @keyframes hiPulse { 0%,100% { box-shadow:inset 0 0 0 1.5px var(--tm), 0 0 0 0 var(--tg); } 50% { box-shadow:inset 0 0 0 2px var(--t), 0 0 18px 4px var(--tg); } }
  .tile.a-hip { animation:flipIn .5s cubic-bezier(.2,1.2,.4,1) both, hiPulse 1.6s ease-in-out .5s 3; }
  .a-pop { animation:popIn .55s cubic-bezier(.2,1.2,.4,1) both; }
  .a-slide { animation:slideUp .38s cubic-bezier(.2,.8,.2,1) backwards; }
  .a-fade { animation:fadeIn .25s ease backwards; }
  .a-out { animation:fadeOut .45s ease both; }
  @keyframes splashOut { 0% { opacity:1; } 100% { opacity:0; } }
  @keyframes splashBg { 0%,30% { background-color:rgb(49,130,246); } 100% { background-color:rgba(49,130,246,0); } }
  .s-out { animation:splashBg .65s ease both; pointer-events:none; }
  .s-out > * { animation:fadeOut .2s ease both; }
  .a-flip { animation:flipIn .5s cubic-bezier(.2,1.2,.4,1) both; }
  .a-pulse { animation:pulse 1.7s ease-in-out infinite; }
  .a-lvup { animation:lvUp .5s cubic-bezier(.2,1.4,.4,1) both; }
  .a-float { animation:rise 2.6s ease-in-out infinite; }

  /* 가챠 오브 */
  .rays { position:absolute; inset:-60%; background:repeating-conic-gradient(var(--tg) 0 7deg, transparent 7deg 22deg); animation:spinSlow 14s linear infinite; border-radius:50%; mask-image:radial-gradient(circle, #000 25%, transparent 68%); -webkit-mask-image:radial-gradient(circle, #000 25%, transparent 68%); }

  /* 아레나 */
  .arena { position:relative; width:100%; border-radius:24px; overflow:hidden; background:#0e1512; box-shadow:0 14px 30px -18px rgba(14,21,18,.7); }
  .arena-box { position:relative; width:100%; aspect-ratio:720/500; container-type:inline-size; margin:0 auto; }
  .arena.fs, .arena:fullscreen { position:fixed; inset:0; z-index:90; width:100vw; height:100dvh; border-radius:0; display:flex; align-items:center; justify-content:center; background:#000; box-shadow:none; }
  .arena.fs .arena-box, .arena:fullscreen .arena-box { width:min(100vw, calc(100dvh * 1.44)); }
  .arena.vert .arena-box { aspect-ratio:500/720; width:min(100vw, calc(100dvh * 0.6944)) !important; }
  .arena.vert .hud { font-size:clamp(8px,2.5cqw,15px); }
  .arena.vert .hud .row { flex-wrap:wrap; row-gap:.7em; }
  .arena.vert .hud .pill { order:-1; flex:1 1 100%; }
  .hud { position:absolute; inset:0; pointer-events:none; padding:2.4cqw 2.6cqw; display:flex; flex-direction:column; justify-content:space-between; font-size:clamp(9px,1.95cqw,16px); }
  .hud .row { display:flex; align-items:flex-start; gap:1.4em; }
  .plate { flex:1; min-width:0; display:flex; align-items:center; gap:.7em; }
  .plate.r { flex-direction:row-reverse; text-align:right; }
  .avatar { width:3.3em; height:3.3em; flex:none; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(9,14,12,.7); box-shadow:0 0 0 .2em var(--team), 0 4px 10px rgba(0,0,0,.4); }
  .avatar span { font-size:1.75em; line-height:1; }
  .pinfo { flex:1; min-width:0; }
  .pname { display:flex; align-items:baseline; gap:.5em; color:#fff; font-weight:800; font-size:1.08em; text-shadow:0 1px 3px rgba(0,0,0,.7); white-space:nowrap; }
  .plate.r .pname { flex-direction:row-reverse; }
  .pname small { font-size:.78em; font-weight:700; color:rgba(255,255,255,.66); overflow:hidden; text-overflow:ellipsis; }
  .hpbar { position:relative; height:.95em; margin-top:.3em; border-radius:99px; background:rgba(0,0,0,.55); overflow:hidden; box-shadow:inset 0 0 0 1px rgba(255,255,255,.12); }
  .hpbar i { position:absolute; top:0; bottom:0; }
  .hpbar i.shbar { bottom:auto; height:46%; background:linear-gradient(180deg,#f3faff,#cfe6ff); box-shadow:0 0 6px rgba(190,225,255,.9); transition:width .12s linear; }
  .hpnum .sh { color:#9fd0ff; margin-left:.35em; }
  .plate .hpnum { color:rgba(255,255,255,.78); font-size:.8em; font-weight:600; margin-top:.2em; }
  .pill { background:rgba(9,14,12,.66); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); border-radius:99px; padding:.4em 1.1em; color:#fff; text-align:center; line-height:1.2; flex:none; box-shadow:inset 0 0 0 1px rgba(255,255,255,.1); }
  .pill b { display:block; font-size:1.25em; font-weight:800; }
  .pill small { font-size:.8em; font-weight:600; color:rgba(255,255,255,.65); }
  .sks { position:relative; width:3.4em; height:3.4em; border-radius:.9em; background:rgba(9,14,12,.7); display:flex; align-items:center; justify-content:center; overflow:hidden; box-shadow:0 0 0 1px rgba(255,255,255,.18); }
  .sks span.e { font-size:1.65em; line-height:1; }
  .sks .cd { position:absolute; inset:0; }
  .sks .n { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:1.1em; text-shadow:0 1px 3px #000; }
  .hbtn { pointer-events:auto; width:2.9em; height:2.9em; border-radius:50%; border:0; display:flex; align-items:center; justify-content:center; background:rgba(9,14,12,.66); color:#fff; font-weight:800; font-size:.95em; box-shadow:inset 0 0 0 1px rgba(255,255,255,.16); cursor:pointer; }
  .hbtn:active { transform:scale(.92); }
  .hbtn svg { width:1.35em; height:1.35em; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .overlay { position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; padding:4cqw; background:rgba(9,14,12,.74); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
  .overlay.on { display:flex; }
  #hExit { display:none; }
  .arena.fs .overlay.on ~ #hExit, .arena:fullscreen .overlay.on ~ #hExit { display:flex; }
  .rcard { font-size:clamp(11px,2.2cqw,17px); width:min(25em,90%); background:#fff; color:var(--ink); border-radius:1.6em; padding:1.3em 1.4em 1.2em; box-shadow:0 20px 40px -12px rgba(0,0,0,.55); text-align:left; }
  .rbtn { position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; gap:.4em; height:3.1em; border-radius:1em; border:0; font-weight:800; font-size:1em; cursor:pointer; }
  .rbtn.p { background:var(--blue); color:#fff; }
  .rbtn.g { background:#eef1f4; color:var(--ink2); }
  .rbtn .fill { position:absolute; inset:0 auto 0 0; background:rgba(255,255,255,.28); width:0; }
  #toast { transition:opacity .2s ease, transform .2s ease; }
  /* 길게 눌러 끌어다 놓기 */
  [data-dex] { -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  [data-dex].lp-hold { transform:scale(1.09) !important; transition:transform .22s cubic-bezier(.2,.9,.3,1) !important; }
  [data-dex].lp-src { opacity:.38; transform:scale(.96) !important; }
  body.drag-f [data-drop^="s:"], body.drag-s [data-drop^="f:"] { opacity:.32; }
  .drop-ok { animation:dropPulse 1.1s ease-in-out infinite; }
  .drop-hot { transform:scale(1.07) !important; box-shadow:0 0 0 3px var(--blue), 0 0 0 9px rgba(49,130,246,.28) !important; background:var(--blue-s) !important; animation:none !important; }
  @keyframes dropPulse { 0%,100% { box-shadow:0 0 0 2px var(--blue), 0 0 0 4px rgba(49,130,246,.10); } 50% { box-shadow:0 0 0 2px var(--blue), 0 0 0 9px rgba(49,130,246,.24); } }
  @keyframes ghostPop { from { transform:scale(1); } to { transform:scale(1.16); } }
  #dragGhost { position:fixed; left:0; top:0; z-index:99; pointer-events:none; will-change:transform; }
  #dragGhost > .tile { margin:0; animation:ghostPop .2s cubic-bezier(.2,1.4,.4,1) both; box-shadow:0 20px 32px -10px rgba(25,31,40,.5), inset 0 0 0 2px var(--tm); }
  #dragHint { position:fixed; left:0; right:0; margin:0 auto; width:max-content; max-width:90%; bottom:92px; z-index:98; padding:11px 18px; border-radius:99px; background:rgba(25,31,40,.92); color:#fff; font-size:14px; font-weight:700; pointer-events:none; white-space:nowrap; animation:slideUp .25s ease backwards; transition:background .15s; }
  #dragHint.hot { background:var(--blue); }
</style>
</head>
<body>

<!-- 로딩 -->
<div id="splash" style="position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#3182f6;">
  <div id="splashLogo" style="will-change:transform"><div style="width:84px;height:84px;border-radius:26px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 7px -4px rgba(8,30,90,.5);animation:popIn .7s cubic-bezier(.2,1.2,.4,1) both;">
    <svg viewBox="0 0 48 48" width="52" height="52" fill="#3182f6"><ellipse cx="24" cy="31" rx="10.5" ry="8.6"/><ellipse cx="11.5" cy="22" rx="4.4" ry="5.6" transform="rotate(-16 11.5 22)"/><ellipse cx="19.2" cy="13.5" rx="4.4" ry="5.8" transform="rotate(-6 19.2 13.5)"/><ellipse cx="28.8" cy="13.5" rx="4.4" ry="5.8" transform="rotate(6 28.8 13.5)"/><ellipse cx="36.5" cy="22" rx="4.4" ry="5.6" transform="rotate(16 36.5 22)"/></svg>
  </div></div>

<script type="module">
const cfg = window.FIREBASE_CONFIG || {};
const configured = !!cfg.apiKey && !/^YOUR/.test(cfg.apiKey);
const API = { configured, ready:false, user:null };
window.ArenaFB = API;
const ping = () => window.dispatchEvent(new Event('arenafb'));
if (!configured) ping();
else {
  try {
    const base = 'https://www.gstatic.com/firebasejs/10.14.1/';
    const [app, au, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
    const fapp = app.initializeApp(cfg), fauth = au.getAuth(fapp), db = fs.getFirestore(fapp);
    const uid = () => fauth.currentUser.uid;
    const setUser = u => { API.user = u ? { uid:u.uid, anon:u.isAnonymous, email:u.email || '', providers:u.providerData.map(p => p.providerId) } : null; API.ready = !!API.user; API.uid = u ? u.uid : null; };
    let first = true;
    await new Promise(res => au.onAuthStateChanged(fauth, async u => {
      if (!u) { try { await au.signInAnonymously(fauth); } catch (e) { console.warn(e); setUser(null); if (first) { first = false; res(); } else ping(); } return; }
      setUser(u); if (first) { first = false; res(); } else ping();
    }));
    const refresh = () => { setUser(fauth.currentUser); ping(); };
    const dropAnon = async () => { const u = fauth.currentUser; if (u && u.isAnonymous) { try { await fs.deleteDoc(fs.doc(db, 'players', u.uid)); } catch (e) { console.warn('guest profile cleanup', e); } } };
    const switchTo = async cred => { await dropAnon(); await au.signInWithCredential(fauth, cred); refresh(); return 'switched'; };
    API.googleConnect = async () => {
      const prov = new au.GoogleAuthProvider(), u = fauth.currentUser;
      try { await au.linkWithPopup(u, prov); refresh(); return 'linked'; }
      catch (e) {
        if (e.code === 'auth/credential-already-in-use') { const cred = au.GoogleAuthProvider.credentialFromError(e); if (cred) return switchTo(cred); }
        throw e;
      }
    };
    API.emailConnect = async (email, pw, mode) => {
      if (mode === 'login') { await dropAnon(); await au.signInWithEmailAndPassword(fauth, email, pw); refresh(); return 'switched'; }
      await au.linkWithCredential(fauth.currentUser, au.EmailAuthProvider.credential(email, pw)); refresh(); return 'linked';
    };
    API.resetPassword = email => au.sendPasswordResetEmail(fauth, email);
    API.logout = async () => { await au.signOut(fauth); /* 리스너가 새 익명 계정을 만든다 */ };
    API.saveProfile = p => fs.setDoc(fs.doc(db, 'players', uid()), { name:p.name, power:p.power, stage:p.stage, team:p.team, ver:p.ver, updatedAt:fs.serverTimestamp() });
    /* 같은 닉네임을 다른 사람이 쓰고 있는지 확인한다 (내 uid·내 pid 기록은 제외) */
    API.nickTaken = async (name, pid) => {
      const snap = await fs.getDocs(fs.query(fs.collection(db, 'players'), fs.where('name', '==', name), fs.limit(10)));
      const me = uid();
      return snap.docs.some(d => d.id !== me && !(pid && d.data().team && d.data().team.pid === pid));
    };
    API.listOpponents = async sort => {
      const snap = await fs.getDocs(fs.query(fs.collection(db, 'players'), fs.orderBy(sort === 'stage' ? 'stage' : 'power', 'desc'), fs.limit(40)));
      const me = uid();
      return snap.docs.filter(d => d.id !== me).map(d => { const x = d.data(); return { uid:d.id, name:x.name, power:x.power, stage:x.stage, team:x.team, at:(x.updatedAt && x.updatedAt.toMillis ? x.updatedAt.toMillis() : 0) }; });
    };
    API.myLogs = async () => (await fs.getDocs(fs.query(fs.collection(db, 'players', uid(), 'logs'), fs.orderBy('at', 'desc'), fs.limit(15)))).docs.map(d => d.data());
    API.logMatch = m => fs.addDoc(fs.collection(db, 'players', m.defenderUid, 'logs'), { attackerUid:uid(), attackerName:String(m.attackerName).slice(0, 12), win:!!m.win, at:fs.serverTimestamp() });
    API.logBattles = list => { const wb = fs.writeBatch(db), me = uid(); for (const r of list) wb.set(fs.doc(fs.collection(db, 'battles')), Object.assign({}, r, { uid:me, srv:fs.serverTimestamp() })); return wb.commit(); };
    API.cloudGet = async () => { const s = await fs.getDoc(fs.doc(db, 'saves', uid())); return s.exists() ? { data:s.data().data, savedAt:s.data().savedAt } : null; };
    API.cloudPut = (data, savedAt, stage) => fs.setDoc(fs.doc(db, 'saves', uid()), { data, savedAt, stage });
  } catch (e) { console.warn('Firebase 연결 실패', e); }
  ping();
}
</script>

function pullMulti(kind, n, free) {

const PATCH_TYPES = { new:['신규', '★', '#d97706', '#fff4dd'], buff:['버프', '▲', '#16a34a', '#e8f8ee'], nerf:['너프', '▼', '#dc2626', '#fdecec'], adjust:['조정', '◆', '#2f7cf0', '#e6f1ff'] };
/* 같은 패치 안에서 같은 종류(신규/버프/너프/조정)의 같은 스킬 항목은 한 카드로 합친다 */
function mergePatchItems(items) {
  const map = new Map();
  for (const it of items) {
    const key = it.type + '|' + (it.sk || it.f || it.name || it.text);
    let m = map.get(key);
    if (!m) { m = { type:it.type, sk:it.sk, f:it.f, emoji:it.emoji, tier:it.tier, name:it.name, lines:[], evos:[] }; map.set(key, m); }
    m.lines.push({ text:it.text, from:it.from, to:it.to });
    if (it.evos) m.evos.push(...it.evos);
  }

  if (u.poison) add(u.poison.burn ? '화상' : '중독', u.poison.burn ? '255,130,50' : '130,220,90', 0); if (u.bleed) add('출혈', '235,60,80', 0); if (u.frost > 0) add('냉기 ' + u.frost, '170,230,255', 0);
  for (const k of ['vuln', 'weak', 'silence', 'blind', 'curse', 'sunder']) if (u[k] > 0) add(DEBUFF_NAME[k], DEBUFF_COL[k], u[k]);
  if (u.markT > 0) add('표식', '255,200,120', u.markT); if (u.invuln > 0) add('무적', '255,240,160', u.invuln); if (u.immuneT > 0) add('면역', '255,240,160', u.immuneT);
  if (u.shield > 0) add('보호막', '170,215,255', 0); if (u.thorns > 0) add('가시', '150,230,150', 0); if (u.evade > 0) add('회피', '200,230,255', u.evade); if (u.buffT > 0) add('강화', '255,170,90', u.buffT);
  if (u.hot) add('재생', '120,235,160', 0); if (u.mirror && u.mirror.t > 0) add('반사', '200,230,255', u.mirror.t);
  if (u.drT > 0 && u.dr > 0) add('받는 피해 -' + Math.round(u.dr*100) + '%', '150,190,255', u.drT); if (u.stealthT > 0) add('은신', '175,150,255', u.stealthT); if (u.mspdT > 0) add('이동 속도 증가', '255,225,140', u.mspdT); else if (u.boostT > 0) add('이동 속도 증가', '255,225,140', u.boostT); if (u.twiT > 0) add('황혼', '255,170,120', u.twiT); if (u.vanish > 0) add('무적(사라짐)', '255,240,160', u.vanish);

}
function drawDemoCd() {

  const cap = en ? 8 : Math.max(sk.b.cd, sk.cd, 1), fill = clamp(en ? sk.cd/cap : 1 - sk.cd/cap, 0, 1), W = 250, H = 38, x = WW - W - 10, y = 10;

  ctx.fillStyle = 'rgba(10,16,30,0.82)'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, W, H, 12) : ctx.rect(x, y, W, H); ctx.fill();
  ctx.fillStyle = en ? 'rgba(255,150,120,0.55)' : (sk.cd <= 0.05 ? 'rgba(120,235,160,0.6)' : 'rgba(130,190,255,0.55)'); ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x + 5, y + H - 11, (W - 10)*fill, 6, 3) : ctx.rect(x + 5, y + H - 11, (W - 10)*fill, 6); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillText((en ? '적 스킬 쿨타임 ' : '쿨타임 ') + (sk.cd > 0.05 ? sk.cd.toFixed(1) + '초' : (en ? '0초' : '준비 완료')), x + 12, y + 14);
  ctx.restore();
}
function drawDemoFade() {
  if (!(Demo.fa > 0.001)) return;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = 'rgba(11,18,16,' + Math.min(1, Demo.fa).toFixed(3) + ')'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.restore();
}
function demoQuiet() {
  if (Demo.kind === 'f') return true;
  const b = B, me = b.me, en = b.en;
  return !(b.zones.length || b.projs.length || b.warns.length || b.meteors.length || b.timers.length || b.links.length || me.act || en.act || me.stun > 0 || en.stun > 0 || b.texts.length > 2 && b.texts.some(t => t.t < 0.3));
}
function drawDemoStatus() {
  if (!B || Demo.kind === 'f') return;
  if (Demo.evName) { ctx.save(); ctx.font = '800 17px Pretendard, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; const tx = '진화 · ' + Demo.evName, w = ctx.measureText(tx).width + 22; ctx.fillStyle = 'rgba(255,190,70,0.92)'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(14, 56, w, 28, 14) : ctx.rect(14, 56, w, 28); ctx.fill(); ctx.fillStyle = '#3a2400'; ctx.fillText(tx, 25, 71); ctx.restore(); }
  for (const u of [B.en, B.me]) {

    ctx.save(); ctx.font = '800 14px Pretendard, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    list.slice(0, 5).forEach(([n, col, tm], i) => {
      const txt = tm > 0 ? n + ' ' + tm.toFixed(1) : n, w = ctx.measureText(txt).width + 22, x = clamp(u.x, w/2 + 6, WW - w/2 - 6), y = u.y + u.r + 20 + i*24;
      ctx.fillStyle = 'rgba(10,16,30,0.78)'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x - w/2, y - 11, w, 22, 11) : ctx.rect(x - w/2, y - 11, w, 22); ctx.fill();
      ctx.strokeStyle = rgba(col, 0.9); ctx.lineWidth = 1.6; ctx.stroke(); ctx.fillStyle = '#fff'; ctx.fillText(txt, x, y + 1);

}
function demoFrame(ts) {
  if (!Demo.on) return;
  try { demoFrame0(ts); } catch (e) { console.warn('demo', e); }
  if (Demo.on) Demo.raf = requestAnimationFrame(demoFrame);
}
function demoFrame0(ts) {
  if (!Demo.canvas || !Demo.canvas.isConnected) { demoStop(); return; }
  const raw = Math.min(0.05, (ts - Demo.last)/1000 || 0); Demo.last = ts; Demo.acc += raw;
  withDemo(() => {
    let n = 0; while (Demo.acc >= STEP && n < 6) { demoStep(STEP); Demo.acc -= STEP; n++; } if (n >= 6) Demo.acc = 0;
    B.shake *= Math.pow(0.0008, raw); B.punch *= Math.pow(0.003, raw); B.hitstop = 0; B.slowmo = 0;

  });

  else if (Demo.ph === 'in') { Demo.fa = Math.max(0, Demo.fa - raw/0.4); if (Demo.fa <= 0) Demo.ph = 'play'; }

}
function demoRestart() { if (!Demo.on) return; withDemo(() => { B = buildDemoBattle(); }); Demo.ph = 'in'; Demo.fa = 0.7; }
function demoMount() {

  if (!detail) return;
  const c = document.getElementById('demoCv'); if (!c) return;
  Demo.kind = detail.kind; Demo.canvas = c; Demo.ctx = c.getContext('2d'); Demo.id = detail.id; Demo.on = true; Demo.acc = 0; Demo.B = {}; Demo.ph = 'in'; Demo.fa = 1;
  withDemo(() => { B = buildDemoBattle(); });
  Demo.last = performance.now(); Demo.raf = requestAnimationFrame(demoFrame);
}
function demoStop() { Demo.on = false; if (Demo.raf) cancelAnimationFrame(Demo.raf); Demo.raf = 0; Demo.canvas = null; Demo.B = null; }
requestAnimationFrame(loop);
