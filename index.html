<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#2b8fb8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@200..900&display=swap"
      rel="stylesheet"
    />
    <title>Pa-Dack</title>
    <style>
      :root {
        --black: #000000;
        --black-rgb: 0 0 0;
        --blue-300: #9a8cff;
        --blue-300-rgb: 154 140 255;
        --blue-400: #7a6aff;
        --blue-400-rgb: 122 106 255;
        --blue-500: #4a7be8;
        --blue-500-rgb: 74 123 232;
        --blue-600: #3b9fd8;
        --blue-600-rgb: 59 159 216;
        --blue-700: #2a4f9a;
        --blue-700-rgb: 42 79 154;
        --blue-800: #2a3a5a;
        --blue-800-rgb: 42 58 90;
        --blue-900: #143246;
        --blue-900-rgb: 20 50 70;
        --blue-950: #0c1c28;
        --blue-950-rgb: 12 28 40;
        --blue-950-b: #0a1428;
        --blue-950-b-rgb: 10 20 40;
        --gray-400: #aaaaaa;
        --gray-400-rgb: 170 170 170;
        --gray-600: #9a8f7a;
        --gray-600-rgb: 154 143 122;
        --gray-600-b: #8a7d66;
        --gray-600-b-rgb: 138 125 102;
        --gray-700: #5f707c;
        --gray-700-rgb: 95 112 124;
        --gray-800: #555555;
        --gray-800-rgb: 85 85 85;
        --gray-950: #1c1e20;
        --gray-950-rgb: 28 30 32;
        --green-400: #8aeaa6;
        --green-400-rgb: 138 234 166;
        --green-500: #58e0a0;
        --green-500-rgb: 88 224 160;
        --green-600: #2fb86a;
        --green-600-rgb: 47 184 106;
        --green-600-b: #3fd08c;
        --green-600-b-rgb: 63 208 140;
        --green-700: #2a9660;
        --green-700-rgb: 42 150 96;
        --green-950: #06281a;
        --green-950-rgb: 6 40 26;
        --orange-300: #ffd9a0;
        --orange-300-rgb: 255 217 160;
        --orange-400: #ffb454;
        --orange-400-rgb: 255 180 84;
        --orange-400-b: #ff8a5b;
        --orange-400-b-rgb: 255 138 91;
        --orange-500: #e8743b;
        --orange-500-rgb: 232 116 59;
        --orange-500-b: #ffb42e;
        --orange-500-b-rgb: 255 180 46;
        --orange-600: #e04a14;
        --orange-600-rgb: 224 74 20;
        --orange-900: #5a1400;
        --orange-900-rgb: 90 20 0;
        --orange-950: #2a1200;
        --orange-950-rgb: 42 18 0;
        --purple-300: #c1a0ff;
        --purple-300-rgb: 193 160 255;
        --red-400: #ff4f6d;
        --red-400-rgb: 255 79 109;
        --red-400-b: #ff7d7d;
        --red-400-b-rgb: 255 125 125;
        --red-600: #e0302e;
        --red-600-rgb: 224 48 46;
        --slate-100: #f2f6f8;
        --slate-100-rgb: 242 246 248;
        --slate-200: #d3dde5;
        --slate-200-rgb: 211 221 229;
        --slate-400: #aebdc8;
        --slate-400-rgb: 174 189 200;
        --slate-500: #8ba5b4;
        --slate-500-rgb: 139 165 180;
        --slate-700: #5d7685;
        --slate-700-rgb: 93 118 133;
        --slate-800: #40586a;
        --slate-800-rgb: 64 88 106;
        --stone-700: #8a7a5a;
        --stone-700-rgb: 138 122 90;
        --teal-300: #9be8d8;
        --teal-300-rgb: 155 232 216;
        --teal-300-b: #8fd3f4;
        --teal-300-b-rgb: 143 211 244;
        --teal-500: #4ac8e8;
        --teal-500-rgb: 74 200 232;
        --teal-700: #2b8fb8;
        --teal-700-rgb: 43 143 184;
        --teal-800: #1c6f86;
        --teal-800-rgb: 28 111 134;
        --white: #ffffff;
        --white-rgb: 255 255 255;
        --yellow-100: #fffdf5;
        --yellow-100-rgb: 255 253 245;
        --yellow-200: #f0e3c8;
        --yellow-200-rgb: 240 227 200;
        --yellow-400: #ffe066;
        --yellow-400-rgb: 255 224 102;
        --yellow-500: #ffd23f;
        --yellow-500-rgb: 255 210 63;
        --dur-fast: 0.15s;
        --dur-base: 0.25s;
        --dur-slow: 0.45s;
        --ease-std: cubic-bezier(0.64, 0.03, 0.21, 0.97);
        --blur-sm: 6px;
        --blur-md: 10px;
        --blur-lg: 16px;
        --opacity-faint: 0.35;
        --opacity-dim: 0.5;
        --opacity-muted: 0.7;
        --opacity-soft: 0.85;
        --opacity-strong: 0.95;
        --gap-panel: 14px;
        --opacity-scrim: 0.2;
        --blur-xs: 2px;
        --pill-top: 10px;
        --pill-h: 34px;
        --z-scrim: 10;
        --z-dialog: 11;
        --z-float: 20;
        --card-min: 150px;
        --slot-min: 120px;
        --stat-min: 86px;
        --radius-panel: 24px;
        --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
        --shadow-float: 0 8px 24px rgb(var(--black-rgb) / 0.4);
        --nav-h: 62px;
        --ink: var(--blue-900);
        --bg0: var(--blue-950);
        --bg1: var(--blue-900);
        --cd: rgb(var(--white-rgb) / 0.05);
        --cd2: rgb(var(--white-rgb) / 0.1);
        --ln: rgb(var(--white-rgb) / 0.1);
        --tx: var(--slate-100);
        --tx2: var(--slate-500);
        --ac: var(--orange-400);
        --ac2: var(--orange-500);
        --ok: var(--green-600-b);
      }
      /* 저사양 모드: 블러 비용 제거 */
      html[data-lowspec] {
        --blur-xs: 0px;
        --blur-sm: 0px;
        --blur-md: 0px;
        --blur-lg: 0px;
      }
      html[data-lowspec] * {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }

      button {
        font: inherit;
      }
      input,
      select,
      textarea {
        font: inherit;
        font-size: 16px; /* iOS: 16px 미만이면 포커스 시 자동 확대 */
      }

      /* iOS: 입력창 포커스 시 자동 확대 방지 (16px 미만이면 Safari가 확대) */

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }

      svg {
        width: 1em;
        height: 1em;
        display: block;
      }
      [data-ic] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
      }
      #stage {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      #fishView {
        position: absolute;
        inset: 0;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #vig {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at 50% 45%,
          rgb(var(--black-rgb) / 0.05) 55%,
          rgb(var(--blue-900-rgb) / 0.3) 100%
        );
      }
      #flash {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: var(--yellow-200);
        opacity: 0;
      }
      #flash.go {
        animation: flash 0.9s ease-out;
      }
      @keyframes flash {
        0% {
          opacity: var(--opacity-soft);
        }
        100% {
          opacity: 0;
        }
      }

      .pill [data-ic] {
        font-size: 20px;
      }
      #hud {
        position: absolute;
        top: calc(env(safe-area-inset-top) + var(--pill-top));
        left: 12px;
        right: 12px;
        height: var(--pill-h);
        display: flex;
        align-items: center;
        gap: 8px;
        z-index: var(--z-float);
        pointer-events: none;
      }

      #status.hide {
        opacity: 0;
        transform: translateX(-50%) translateY(-6px);
      }
      #status.alert {
        background: rgb(var(--red-600-rgb) / 0.9);
        animation: pop 0.3s infinite alternate;
      }
      @keyframes pop {
        to {
          transform: translateX(-50%) scale(1.07);
        }
      }
      #toast {
        position: absolute;
        left: 50%;
        bottom: 150px;
        transform: translateX(-50%) translateY(10px);
        background: rgb(var(--blue-950-rgb) / 0.8);
        backdrop-filter: blur(var(--blur-md));
        color: var(--tx);
        border-radius: 999px;
        padding: 9px 18px;
        font-weight: 600;
        font-size: 14px;
        box-shadow: 0 6px 20px rgb(var(--black-rgb) / 0.3);
        opacity: 0;
        pointer-events: none;
        transition: var(--dur-base) var(--ease-std);
        white-space: normal;
        width: max-content;
        max-width: min(86%, 340px);
        text-align: center;
        text-wrap: balance;
        line-height: 1.35;
        word-break: keep-all;
        z-index: var(--z-float);
      }
      #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      #joy.on {
        opacity: 1;
      }
      #joy.ghost {
        opacity: var(--opacity-faint);
      }

      #act {
        position: absolute;
        right: 40px;
        bottom: 110px;
        width: 96px;
        height: 96px;
        border-radius: 50%;
        border: 3px solid var(--white);
        background: radial-gradient(
          circle at 35% 30%,
          var(--orange-500),
          var(--orange-600)
        );
        box-shadow: 0 4px 14px rgb(var(--black-rgb) / 0.25);
        color: var(--white);
        font-family: inherit;
        font-weight: 900;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        cursor: pointer;
        transition:
          transform var(--dur-fast),
          filter var(--dur-base);
        font-size: 13px;
        white-space: nowrap;
        letter-spacing: -0.02em;
      }
      #act[data-s="reel"] {
        font-size: 18px;
        background: radial-gradient(
          circle at 35% 30%,
          var(--green-400),
          var(--green-600)
        );
      }
      #act[data-s="bite"] {
        font-size: 17px;
        background: radial-gradient(
          circle at 35% 30%,
          var(--red-400-b),
          var(--red-600)
        );
        animation: bite 0.22s infinite alternate;
      }

      #act .ai {
        font-size: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #act .ai b {
        font-size: 40px;
        line-height: 36px;
      }
      #act:active {
        transform: scale(0.92);
      }
      #act[data-s="off"] {
        filter: grayscale(0.85) brightness(1.05);
        opacity: var(--opacity-muted);
      }
      #act[data-s="busy"] {
        filter: grayscale(0.4);
        opacity: var(--opacity-soft);
      }
      #act[data-s="ready"] {
        animation: ready 1.1s ease-in-out infinite;
      }
      @keyframes ready {
        50% {
          transform: scale(1.08);
        }
      }
      #act[data-s="ptl"] {
        background: radial-gradient(
          circle at 35% 30%,
          var(--blue-300),
          var(--blue-500)
        );
        animation: ready 1.1s ease-in-out infinite;
      }
      #act[data-s="wait"] {
        background: radial-gradient(
          circle at 35% 30%,
          var(--teal-300-b),
          var(--blue-600)
        );
      }

      @keyframes bite {
        to {
          transform: scale(1.1);
        }
      }

      #act[data-s="charge"] {
        animation: bite 0.3s infinite alternate;
      }
      #actT {
        text-shadow: 0 1px 2px rgb(var(--orange-900-rgb) / 0.6);
      }

      #card.show {
        transform: translate(-50%, 0);
        opacity: 1;
        pointer-events: auto;
      }

      #cImg {
        width: 66px;
        height: 66px;
      }
      #card.show #cEmoji {
        animation: wob 1.2s ease-in-out infinite;
      }
      @keyframes wob {
        50% {
          transform: rotate(-8deg) scale(1.08);
        }
      }

      .new {
        background: var(--red-400);
        color: var(--white);
        font-size: 11px;
        padding: 2px 7px;
        border-radius: 8px;
        display: none;
      }

      .cinfo span {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .panel * {
        touch-action: manipulation;
      }
      /* 장비/판매소/설정 등: 중앙 팝업 다이얼로그 */
      #dim {
        position: absolute;
        inset: 0;
        z-index: var(--z-scrim);
        background: rgb(var(--black-rgb) / var(--opacity-scrim));
        backdrop-filter: blur(var(--blur-xs));
        -webkit-backdrop-filter: blur(var(--blur-xs));
        opacity: 0;
        visibility: hidden;
        transition:
          opacity var(--dur-base) var(--ease-out),
          visibility var(--dur-base);
      }
      #dim.on {
        opacity: 1;
        visibility: visible;
      }
      .panel {
        touch-action: manipulation;
        position: absolute;
        top: calc(
          env(safe-area-inset-top) + var(--pill-top) + var(--pill-h) +
            var(--gap-panel)
        );
        left: 50%;
        bottom: calc(env(safe-area-inset-bottom) + 96px);
        width: min(calc(100% - 32px), 600px);
        z-index: var(--z-dialog);
        display: flex;
        flex-direction: column;
        gap: var(--gap-panel);
        overflow: auto;
        padding: 0 0 16px;
        border-radius: var(--radius-panel);
        background: linear-gradient(var(--bg1), var(--bg0));
        box-shadow: var(--shadow-float);
        color: var(--tx);
        visibility: hidden;
        opacity: 0;
        transform: translate(-50%, 5%) scale(0.9);
        transition:
          opacity var(--dur-base) var(--ease-out),
          transform var(--dur-base) var(--ease-out),
          visibility var(--dur-base);
      }
      .panel.on {
        visibility: visible;
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }

      .panel .sub {
        margin: 0 0 16px;
        font-size: 13px;
        color: var(--gray-600-b);
        font-weight: 600;
      }

      .row:last-child {
        border: 0;
      }

      .row .e img {
        width: 44px;
        height: 44px;
      }

      .row .g small svg {
        width: 13px;
        height: 13px;
      }

      .gm {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .mach {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .mach .e {
        font-size: 40px;
        color: var(--orange-500);
        width: 48px;
        display: flex;
        justify-content: center;
      }

      .mach .t small {
        display: block;
        font-weight: 600;
        color: var(--gray-600);
        margin-top: 2px;
      }
      .sw {
        position: relative;
        width: 50px;
        height: 28px;
        flex: none;
      }
      .sw input {
        opacity: 0;
        width: 100%;
        height: 100%;
        position: absolute;
        margin: 0;
      }

      .sw i:after {
        content: "";
        position: absolute;
        left: 3px;
        top: 3px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--white);
        transition: var(--dur-base);
      }

      .sw input:checked + i:after {
        left: 25px;
      }

      .av {
        border-radius: 50%;
        border: 4px solid var(--white);
        box-shadow: 0 2px 8px rgb(var(--blue-900-rgb) / 0.25);
        padding: 0;
        aspect-ratio: 1;
        overflow: hidden;
        cursor: pointer;
        background: var(--white);
      }
      .av img {
        width: 100%;
        height: 100%;
        display: block;
      }

      [hidden] {
        display: none !important;
      }

      .cname span:first-child {
        word-break: keep-all;
      }

      .row .g {
        flex: 1;
        font-weight: 800;
        font-size: 15px;
        min-width: 0;
        word-break: keep-all;
      }

      .badge {
        position: absolute;
        top: 5px;
        left: calc(50% + 8px);
        min-width: 17px;
        height: 17px;
        padding: 0 4px;
        border-radius: 100vmax;
        color: var(--white);
        font-size: 10px;
        font-weight: 900;
        font-style: normal;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--blue-950);
        background: var(--red-400);
      }

      .mach .t {
        flex: 1;
        font-weight: 900;
        min-width: 0;
        word-break: keep-all;
      }

      #loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: radial-gradient(
          120% 70% at 50% 0,
          var(--teal-800),
          var(--blue-950) 70%
        );
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        color: var(--white);
        font-weight: 800;
        font-size: 16px;
      }

      #loader p {
        margin: 0;
        text-shadow: 0 2px 6px rgb(var(--blue-900-rgb) / 0.3);
      }
      .spin {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 5px solid rgb(var(--white-rgb) / 0.4);
        border-top-color: var(--white);
        animation: sp 1s linear infinite;
      }
      @keyframes sp {
        to {
          transform: rotate(360deg);
        }
      }
      #tut {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: rgb(var(--blue-900-rgb) / 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .tutbox {
        background: var(--yellow-100);
        border-radius: 24px;
        padding: 20px 18px;
        max-width: 380px;
        width: 100%;
        max-height: 100%;
        overflow: auto;
        box-shadow: 0 14px 40px rgb(var(--blue-950-rgb) / 0.5);
      }
      .tutbox h2 {
        margin: 0 0 8px;
        font-size: 20px;
        text-align: center;
      }
      .tr {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 10px 0;
        border-bottom: 1px dashed var(--yellow-200);
      }
      .tr .ti {
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: var(--yellow-200);
        color: var(--orange-500);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 23px;
      }
      .tr b {
        display: block;
        font-size: 15px;
        margin-bottom: 2px;
      }
      .tr span {
        font-size: 13px;
        color: var(--gray-700);
        line-height: 1.45;
        word-break: keep-all;
        display: block;
      }
      .tr > div:last-child {
        min-width: 0;
      }
      /* ---- UI 보정: 줄바꿈 / 넘침 ---- */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--black);
        overscroll-behavior: none;
        font-family:
          "Chiron GoRound TC",
          -apple-system,
          BlinkMacSystemFont,
          "Apple SD Gothic Neo",
          "Noto Sans KR",
          "Malgun Gothic",
          system-ui,
          sans-serif;
        color: var(--ink);
        word-break: keep-all;
        overflow-wrap: break-word;
        line-height: 1.3;
        letter-spacing: -0.01em;
        background:
          radial-gradient(
            120% 60% at 50% -10%,
            var(--blue-900) 0,
            transparent 60%
          ),
          linear-gradient(var(--bg1), var(--bg0));
      }
      ::-webkit-scrollbar {
        display: none;
      }

      .cbadges {
        display: flex;
        margin: 3px 0;
        flex-wrap: wrap;
        gap: 4px 6px;
      }

      #card > div:last-child {
        min-width: 0;
        flex: 1;
      }

      /* ---- 도감 ---- */

      .dh1 {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }
      .dh1 small {
        display: block;
        font-size: 12px;
        font-weight: 700;
        opacity: var(--opacity-soft);
      }
      .dh1 b {
        font-size: 34px;
        font-weight: 900;
        line-height: 1.05;
      }
      .dh1 span {
        font-size: 16px;
        font-weight: 800;
        opacity: var(--opacity-soft);
        margin-left: 2px;
      }
      .dpct {
        font-size: 20px;
        font-weight: 900;
        background: rgb(var(--white-rgb) / 0.2);
        border-radius: 12px;
        padding: 4px 10px;
      }
      .dbar {
        height: 9px;
        border-radius: 9px;
        background: rgb(var(--white-rgb) / 0.3);
        overflow: hidden;
        margin-top: 10px;
      }
      .dbar i {
        display: block;
        height: 100%;
        border-radius: 9px;
        background: linear-gradient(
          90deg,
          var(--yellow-400),
          var(--orange-500-b)
        );
        width: 0;
        transition: width var(--dur-slow);
      }
      .dbar.s {
        height: 6px;
        margin-top: 5px;
      }
      .dsub {
        display: flex;
        gap: 14px;
        margin-top: 12px;
      }

        font-weight: 700;

      .gt {

      .grgrid.one {

      }
      .grgrid.one .gcard b {

      .grs {

      .grcap {

        font-size: 16px;
        letter-spacing: 0;
      }
      .grcap p {
        margin: 0;
      }
      .grball {
        border-radius: 50%;
        margin: 0 auto 14px;
        background: radial-gradient(
          circle at 35% 30%,
          var(--white),
          var(--bc, var(--yellow-500)) 55%,
          var(--blue-800)
        );
        box-shadow: 0 0 40px var(--bc, var(--yellow-500));
        animation: grs 0.35s infinite alternate;
        width: 104px;
        height: 104px;
      }
      /* ===== 뽑기 연출 v3 (절제된 스타일) ===== */
      #grOv {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          circle at 50% 42%,
          var(--blue-900),
          var(--blue-950) 72%
        );
        padding: 0;
        overflow: hidden;
      }
      .gxdim {
        position: fixed;
        inset: 0;
        background: radial-gradient(
          circle at 50% 42%,
          transparent 10%,
          rgb(var(--black-rgb) / 0.8) 78%
        );
        opacity: 0;
        transition: opacity 1.2s;
        z-index: 1;
        pointer-events: none;
      }
      #grOv.dk .gxdim {
        opacity: 1;
      }
      .gxflash {
        position: fixed;
        inset: 0;
        background: var(--white);
        opacity: 0;
        z-index: 7;
        pointer-events: none;
      }
      .gxflash.go {
        animation: gxfl 0.6s ease-out;
      }
      @keyframes gxfl {
        0% {
          opacity: var(--opacity-faint);
        }
        100% {
          opacity: 0;
        }
      }
      .gxskip {
        position: fixed;
        right: 16px;
        top: calc(env(safe-area-inset-top, 0px) + 14px);
        z-index: 9;
        border: 1px solid rgb(var(--white-rgb) / 0.2);
        border-radius: 999px;
        padding: 7px 14px;
        background: transparent;
        color: var(--slate-400);
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.04em;
      }
      .gxmain {
        position: relative;
        z-index: 3;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: auto;
        padding: 20px 18px;
      }
      #grOv.shk .gxmain {
        animation: gxshk 0.4s;
      }
      @keyframes gxshk {
        0%,
        100% {
          transform: none;
        }
        25% {
          transform: translateY(3px);
        }
        60% {
          transform: translateY(-2px);
        }
      }
      .gxone {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 330px;
        margin: auto;
      }
      .gxst {
        position: relative;
        width: min(58vw, 208px);
        aspect-ratio: 1;
        flex: none;
        transition:
          opacity var(--dur-slow),
          transform var(--dur-slow);
      }
      .gxone .gxst {
        margin-bottom: 18px;
      }
      .gxd1 {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(
          circle at 50% 36%,
          var(--slate-100),
          var(--slate-400)
        );
        opacity: 0;
        animation: gxin 0.7s 0.1s ease-out forwards;
      }
      .gxd2 {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(
          circle at 50% 36%,
          color-mix(in srgb, var(--rc) 26%, var(--blue-900)),
          var(--blue-950) 78%
        );
        opacity: 0;
        transition: opacity var(--dur-slow);
      }
      .gxring {
        position: absolute;
        inset: auto;
        border-radius: 50%;
        left: -7%;
        top: -7%;
        width: 114%;
        height: 114%;
        transform: rotate(-90deg);
        overflow: visible;
      }
      .gxpulse {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1.5px solid var(--rc);
        opacity: 0;
      }

      @keyframes gxin {
        to {
          opacity: var(--opacity-strong);
        }
      }

      .gxring circle {
        fill: none;
        stroke-width: 1.6;
        stroke: rgb(var(--white-rgb) / 0.6);
        transition: stroke var(--dur-slow);
      }
      .gxring .bg {
        stroke: rgb(var(--white-rgb) / 0.1);
      }
      .gxst.cr .gxring .fg {
        stroke: var(--rc);
      }

      .gxst.op .gxpulse {
        animation: gxpl 0.9s ease-out;
      }
      @keyframes gxpl {
        0% {
          opacity: var(--opacity-strong);
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(1.55);
        }
      }
      .gxsw {
        position: absolute;
        left: 14%;
        top: 14%;
        width: 72%;
        height: 72%;
      }
      .gxsw img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        transition: opacity var(--dur-slow);
      }
      .gxsw .s1 {
        filter: brightness(0) opacity(0.82);
      }
      .gxsw .s2 {
        opacity: 0;
        filter: drop-shadow(0 6px 10px rgb(var(--black-rgb) / 0.4));
      }
      .gxst.op .s1 {
        opacity: 0;
      }
      .gxst.op .s2 {
        opacity: 1;
      }
      .gxst.op .d1x {
        opacity: 0;
      }
      .gxst.op .gxd2 {
        opacity: 1;
      }
      .gxst.op .gxd1 {
        opacity: 0;
        transition: opacity var(--dur-slow);
        animation: none;
      }
      .gxst.out {
        opacity: 0;
        transform: scale(0.92);
      }
      /* 종류별 등장 */
      .sw-rod::before {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 92%;
        width: 1.5px;
        height: 110vh;
        margin-left: -1px;
        background: rgb(var(--white-rgb) / 0.6);
      }
      .sw-rod {
        animation: gxrod 0.9s cubic-bezier(0.3, 0.8, 0.35, 1) both;
      }
      @keyframes gxrod {
        0% {
          transform: translateY(-55vh);
        }
        60% {
          transform: translateY(8px);
        }
        100% {
          transform: none;
        }
      }
      .sw-rod.w1 {
        animation: gxrw 1.1s ease-in-out infinite alternate;
      }
      .sw-rod.w2 {
        animation: gxrw2 0.22s ease-in-out infinite alternate;
      }
      @keyframes gxrw {
        from {
          transform: translateY(-3px);
        }
        to {
          transform: translateY(8px);
        }
      }
      @keyframes gxrw2 {
        from {
          transform: translateY(-4px);
        }
        to {
          transform: translateY(10px);
        }
      }
      .sw-shoes {
        animation: gxsh 0.85s both;
      }
      @keyframes gxsh {
        0% {
          transform: translateY(-60vh);
        }
        40% {
          transform: translateY(0) scale(1.06, 0.94);
        }
        58% {
          transform: translateY(-22px);
        }
        78% {
          transform: translateY(0) scale(1.05, 0.95);
        }
        100% {
          transform: none;
        }
      }
      .sw-shoes.w1 {
        animation: gxsw1 0.9s ease-in-out infinite;
      }
      .sw-shoes.w2 {
        animation: gxsw1 0.45s ease-in-out infinite;
      }
      @keyframes gxsw1 {
        0%,
        100% {
          transform: none;
        }
        50% {
          transform: translateY(-10px);
        }
      }
      .sw-hat {
        animation: gxhat 1.1s cubic-bezier(0.3, 0.7, 0.3, 1) both;
      }
      @keyframes gxhat {
        0% {
          transform: translateY(-55vh) rotate(-24deg);
        }
        45% {
          transform: translate(-14px, -12vh) rotate(12deg);
        }
        75% {
          transform: translate(8px, -3vh) rotate(-6deg);
        }
        100% {
          transform: none;
        }
      }
      .sw-hat.w1 {
        animation: gxhw 1.4s ease-in-out infinite alternate;
      }
      .sw-hat.w2 {
        animation: gxhw 0.5s ease-in-out infinite alternate;
      }
      @keyframes gxhw {
        from {
          transform: rotate(-4deg);
        }
        to {
          transform: rotate(4deg);
        }
      }
      .sw-pet {
        animation: gxpet 1s both;
      }
      @keyframes gxpet {
        0% {
          transform: translate(-70vw, 0);
        }
        25% {
          transform: translate(-44vw, -38px);
        }
        50% {
          transform: translate(-18vw, 0);
        }
        75% {
          transform: translate(-5vw, -26px);
        }
        100% {
          transform: none;
        }
      }
      .sw-pet.w1 {
        animation: gxpw 1s ease-in-out infinite;
      }
      .sw-pet.w2 {
        animation: gxpw 0.5s ease-in-out infinite;
      }
      @keyframes gxpw {
        0%,
        100% {
          transform: none;
        }
        50% {
          transform: translateY(-10px);
        }
      }
      /* 결과 정보 */
      .gxinfo {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        opacity: 0;
        transform: translateY(10px);
        transition:
          opacity var(--dur-slow),
          transform var(--dur-slow);
      }
      .gxinfo.on {
        opacity: 1;
        transform: none;
      }
      .gxrl {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--rc);
        font-weight: 800;
        font-size: 12px;
        letter-spacing: 0.3em;
        margin-bottom: 8px;
      }
      .gxrl::before,
      .gxrl::after {
        content: "";
        width: 26px;
        height: 1px;
        background: var(--rc);
        opacity: var(--opacity-muted);
      }
      .gxnm {
        font-size: 24px;
        font-weight: 800;
        color: var(--slate-100);
        line-height: 1.25;
        text-align: center;
        word-break: keep-all;
        overflow-wrap: anywhere;
        margin-bottom: 10px;
      }
      .gxpp {
        display: flex;
        gap: 5px;
        margin-bottom: 10px;
      }
      .gxpp i {
        width: 14px;
        height: 3px;
        border-radius: 2px;
        background: var(--rc);
      }
      .gxinfo .gt {
        display: block;
        width: max-content;
        margin: 0 0 14px;
        padding: 3px 14px;
        font-size: 12px;
      }
      .gxinfo .stls {
        width: 100%;
        margin: 0 0 14px;
      }
      .gxinfo #grOk,
      .gxten #grOk {
        width: 100%;
      }
      .gxinst .gxinfo,
      .gxinst .gxst,
      .gxinst .gxst *,
      .gxinst .gxc * {
        transition: none !important;
        animation-duration: 0s !important;
        animation-delay: 0s !important;
      }
      /* 10연 */
      .gxten {
        width: 100%;
        max-width: 420px;
        margin: auto;
      }
      .gxten h3 {
        margin: 0 0 16px;
        text-align: center;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.24em;
        color: var(--slate-500);
      }
      .gxgrid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        margin-bottom: 14px;
      }
      .gxc {
        position: relative;
        aspect-ratio: 3/4.3;
        perspective: 700px;
        min-width: 0;
      }
      .gxc .in {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        transition: transform var(--dur-slow) cubic-bezier(0.3, 1.1, 0.5, 1);
      }
      .gxc.fl .in {
        transform: rotateY(180deg);
      }
      .gxc.lf .in {
        transform: translateY(-5px) scale(1.04);
      }
      .gxc.lf.fl .in {
        transform: rotateY(180deg);
      }
      .gxc .gxb {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        border-radius: 12px;
        background: var(--blue-950);
        border: 1px solid rgb(var(--white-rgb) / 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .gxc .gxf {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        border-radius: 12px;
        transform: rotateY(180deg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 8px 3px 7px;
        background: linear-gradient(
          180deg,
          color-mix(in srgb, var(--rc) 20%, var(--blue-900)),
          var(--blue-950)
        );
        border: 1px solid color-mix(in srgb, var(--rc) 55%, transparent);
      }

      .gxc .gxb i {
        width: 26%;
        aspect-ratio: 1;
        border: 1px solid rgb(var(--white-rgb) / 0.3);
        border-radius: 50%;
      }

      .gxc .gxf img {
        width: 74%;
        aspect-ratio: 1;
        object-fit: contain;
      }
      .gxc .gxf .nm {
        font-size: 9.5px;
        line-height: 1.2;
        font-weight: 700;
        color: var(--slate-100);
        text-align: center;
        word-break: keep-all;
        overflow-wrap: anywhere;
        padding: 0 1px;
      }
      .gxc .gxf .bar {
        width: 60%;
        height: 2px;
        border-radius: 1px;
        background: var(--rc);
      }
      .gxc .gxf em {
        position: absolute;
        left: 5px;
        top: 4px;
        font-style: normal;
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 0.06em;
        color: var(--rc);
      }
      .gxc::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 12px;
        border: 1.5px solid var(--rc);
        opacity: 0;
        pointer-events: none;
      }
      .gxc.pl::after {
        animation: gxcp 0.7s ease-out;
      }
      @keyframes gxcp {
        0% {
          opacity: var(--opacity-strong);
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(1.35);
        }
      }
      .gxsum {
        display: flex;
        justify-content: center;
        gap: 18px;
        margin: 0 0 14px;
        color: var(--slate-500);
        font-size: 13px;
        font-weight: 700;
        opacity: 0;
        transition: opacity var(--dur-slow);
      }
      .gxsum.on {
        opacity: 1;
      }
      .gxsum b {
        color: var(--slate-100);
        margin-left: 6px;
      }
      /* 왼쪽 하단 채팅 로그 */
      #chatDock {
        --dw: min(340px, 62vw);
        position: absolute;
        left: 12px;
        top: calc(env(safe-area-inset-top) + 50px);
        width: var(--dw);
        z-index: 6;
        display: flex;
        flex-direction: column;
        gap: 6px;
        pointer-events: none;
      }

      #chatLog.has {
        pointer-events: auto;
      }
      #chatDock.expanded #chatLog {
        background: transparent;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        border-radius: 0;
      }

      #chatLogWrap {
        position: relative;
        height: 180px;
        transition: opacity 1s linear;
      }
      #chatNew {
        top: auto;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        padding: 2px 9px;
        border: 0;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        pointer-events: auto;
      }
      #chatNew.on {
        display: block;
      }

      #chatLog {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 180px;
        padding-top: 64px;
        padding-bottom: 5px;
        box-sizing: border-box;
        overflow-y: auto;
        overscroll-behavior: contain;
        overflow-anchor: none; /* 스크롤 위치는 pushLine에서 직접 보정 (브라우저 앵커링과 이중 보정 방지) */
        scrollbar-width: none;
        pointer-events: none;
        touch-action: none;
        -webkit-mask-image: linear-gradient(
          to bottom,
          transparent 0,
          var(--black) 64px,
          var(--black) calc(100% - 5px),
          transparent 100%
        );
        mask-image: linear-gradient(
          to bottom,
          transparent 0,
          var(--black) 64px,
          var(--black) calc(100% - 5px),
          transparent 100%
        );
        background: transparent;
      }
      #chatLogWrap.out {
        opacity: var(--opacity-dim);
      }
      #chatLog::before {
        content: "";
        margin-top: auto;
      }
      .cl {
        flex: none;
        width: fit-content;
        max-width: 100%;
        margin-top: 3px;
        padding: 2px 7px;
        border-radius: 6px;
        background: rgb(var(--blue-950-rgb) / 0.3);
        color: var(--tx);
        font-size: 13px;
        font-weight: 700;
        line-height: 1.4;
        text-shadow: 0 1px 3px rgb(var(--black-rgb) / 0.7);
        word-break: break-all;
      }
      .cl .nk {
        color: var(--yellow-400);
      }
      .cl .ms {
        color: var(--tx);
      }
      .cl.sys {
        color: var(--slate-200);
        font-style: italic;
      }
      .cl.adm .nk {
        color: var(--red-400);
      }
      .cl.notice {
        color: var(--purple-300);
      }
      #chatInputRow {
        display: flex;
        align-items: center;
        width: 40px;
        height: 40px;
        box-sizing: border-box;
        padding: 0;
        overflow: hidden;
        pointer-events: auto;
        border: 0;
        border-radius: 20px;
        background: rgb(var(--blue-950-rgb) / 0.6);
        backdrop-filter: blur(var(--blur-md));
        -webkit-backdrop-filter: blur(var(--blur-md));
        box-shadow: 0 4px 14px rgb(var(--black-rgb) / 0.25);
        transition:
          width var(--dur-base) ease,
          padding var(--dur-base) ease,
          border-radius var(--dur-base) ease;

      #chatInputRow.open {
        width: var(--dw);
        padding: 0 6px 0 10px;
        border-radius: 8px;
      }
      #chatOpen {
        flex: none;
        width: 38px;
        height: 38px;
        border: 0;
        background: none;
        color: var(--tx);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        cursor: pointer;
        overflow: hidden;
        transition:
          width var(--dur-base) ease,
          opacity var(--dur-base);
      }
      #chatOpen svg {
        width: 20px;
        height: 20px;
        flex: none;
      }
      #chatInputRow.open #chatOpen {
        width: 0;
        opacity: 0;
        pointer-events: none;
      }
      #chatTag {
        flex: none;
        max-width: 0;
        overflow: hidden;
        white-space: nowrap;
        color: var(--yellow-400);
        font-size: 13px;
        font-weight: 800;
        text-shadow: 0 1px 3px rgb(var(--black-rgb) / 0.7);
        opacity: 0;
        transition:
          max-width var(--dur-base) ease,
          opacity var(--dur-fast),
          margin var(--dur-base) ease;
      }
      #chatInputRow.open #chatTag {
        max-width: 60px;
        opacity: 1;
        margin-right: 6px;
      }
      #chatIn {
        flex: 1 1 0;
        min-width: 0;
        height: 100%;
        border: 0;
        background: transparent;
        color: var(--tx);
        padding: 0;
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        outline: none;
        opacity: 0;
        transition: opacity var(--dur-fast);
        -webkit-user-select: text;
        user-select: text;
        touch-action: manipulation;
      }
      #chatInputRow.open #chatIn {
        opacity: 1;
      }
      #chatSend {
        flex: none;
        width: 0;
        height: 32px;
        margin-left: 0;
        border: 0;
        border-radius: 50%;
        padding: 0;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: none;
        color: var(--tx);
        opacity: 0;
        pointer-events: none;
        transition:
          width var(--dur-base) ease,
          margin var(--dur-base) ease,
          opacity var(--dur-base);
      }
      #chatSend svg {
        width: 16px;
        height: 16px;
        flex: none;
      }
      #chatInputRow.open #chatSend {
        width: 32px;
        margin-left: 6px;
        opacity: 1;
        pointer-events: auto;
      }
      #chatQ {
        display: none;
        flex-wrap: wrap;
        gap: 6px;
        pointer-events: auto;
      }
      #chatDock.expanded #chatQ {
        display: flex;
      }
      #chatQ .qc {
        display: inline-flex;
        align-items: center;
        gap: 6px;

    <script>
      const __start = () => {
        "use strict"
        /* ================= Firebase 설정 (여기에 콘솔의 firebaseConfig 값을 붙여 넣어요) ================= */
        const FIREBASE_CONFIG = {
          apiKey: "AIzaSyCf9lyTEblW9BGqYzzY35LXaE6oSz52L0E",
          authDomain: "pa-dack.firebaseapp.com",
          databaseURL: "https://pa-dack-default-rtdb.firebaseio.com",
          projectId: "pa-dack",
          storageBucket: "pa-dack.firebasestorage.app",
          messagingSenderId: "373128457861",
          appId: "1:373128457861:web:563eb2cfe200f9f7a3c3ec",
        }
        const ADMIN_EMAIL = "geniusted1129@gmail.com"
        const CFGX = { price: 1, luck: 0, bite: 1, fish: {} }
        const isAdminUser = () => !!(MP.user && MP.user.email === ADMIN_EMAIL)
        function blockScreen(msg, sub, btn) {
          let el = document.getElementById("blk")
          if (!msg) {
            if (el) el.remove()
            return
          }
          if (!el) {
            el = document.createElement("div")
            el.id = "blk"
            el.style.cssText =
              "position:fixed;inset:0;z-index:300;background:rgba(6,14,22,.96);color:#eef6fa;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;font-weight:800;font-size:19px;word-break:keep-all;touch-action:manipulation"
            document.body.appendChild(el)
          }
          el.innerHTML = ""
          const a = document.createElement("div")
          a.textContent = msg
          el.appendChild(a)
          if (sub) {
            const b = document.createElement("div")
            b.textContent = sub
            b.style.cssText =
              "font-size:14px;font-weight:600;color:#8ba5b4;max-width:320px"
            el.appendChild(b)
          }
          if (btn) {
            const x = document.createElement("button")
            x.textContent = "로그아웃"
            x.style.cssText =
              "margin-top:8px;border:0;border-radius:12px;padding:10px 18px;font-weight:800;font-size:14px;background:#ffb454;color:#2a1200"
            x.onclick = () => {
              try {
                MP.auth.signOut()
              } catch (e) {}
            }
            el.appendChild(x)
          }
        }
        function syncBlock() {
          if (MP.ban)
            blockScreen("이용이 제한된 계정이에요", MP.ban.reason || "", true)
          else if (MP.maint)
            blockScreen(
              "점검 중이에요",
              MP.maintMsg || "잠시 후 다시 접속해 주세요",
            )
          else blockScreen("")
        }
        function applyBan(v) {
          MP.ban = v ? (typeof v === "object" ? v : { reason: "" }) : null
          syncBlock()
        }
        function applyCfg(v) {
          v = v || {}
          CFGX.price = clamp(+v.price || 1, 0.1, 10)
          CFGX.luck = clamp(+v.luck || 0, 0, 5)
          CFGX.bite = clamp(+v.bite || 1, 0.2, 5)
          CFGX.fish = v.fish && typeof v.fish === "object" ? v.fish : {}
          const mt = v.maintenance
          MP.maint = !!(mt && mt.on && !isAdminUser())
          MP.maintMsg = mt && mt.msg ? String(mt.msg).slice(0, 120) : ""
          syncBlock()
          const bc = v.bc
          if (bc && bc.id) {
            let last = ""
            try {
              last = localStorage.getItem("pd-bc") || ""
            } catch (e) {}
            if (
              String(bc.id) !== last &&
              Date.now() + (MP.off || 0) - bc.id < 600000
            ) {
              try {
                localStorage.setItem("pd-bc", String(bc.id))
              } catch (e) {}
              {
                const nt = String(bc.text || "").slice(0, 100)
                showToast("[공지] " + nt, 6500)
                addNotice(nt)
              }
            }
          }
        }
        const MP = {
          on: false,
          db: null,
          auth: null,
          user: null,
          me: null,
          refs: null,
          others: {},
          acc: 0,
          lastKey: "",
          online: 1,
          say: null,
          selfBub: null,
          skip: false,
          ready: false,
          sUid: null,
          err: "",
        }
        /* ================= 저장 / 상태 ================= */
        const SAVE_KEY = "healing-fishing-v3"
        const defaultSave = () => ({
          gold: 0,
          inv: [],
          codex: {},
          settings: { sound: true, vibe: true },
          gear: { speed: 1, power: 1, zone: 0, luck: 0, bite: 1 },
          avatar: 0,
          tut: 0,
          nick: "",
          earned: 0,
          items: {},
          equip: { rod: "", shoes: "", hat: "" },
          pity: { rod: 0, shoes: 0, hat: 0 },
          ptl: [],
        }) // 뽑기/강화가 이 값을 바꿀 예정
        let save = (() => {
          try {
            const s = JSON.parse(localStorage.getItem(SAVE_KEY))
            return s ? Object.assign(defaultSave(), s) : defaultSave()
          } catch (e) {
            return defaultSave()
          }
        })()
        /* 로그인 계정은 uid별 캐시 키, 비로그인(오프라인) 진행은 SAVE_KEY. 서로 섞이지 않는다. */
        const ukey = (uid) => SAVE_KEY + ":u:" + uid
        function persist() {
          try {
            if (MP.user) {
              if (MP.ready && MP.sUid === MP.user.uid)
                localStorage.setItem(ukey(MP.user.uid), JSON.stringify(save))
            } else localStorage.setItem(SAVE_KEY, JSON.stringify(save))
          } catch (e) {}
          cloudDirty() // 클라우드 로드가 끝난 계정만 1.5초 뒤 저장
        }
        function readOffline() {
          try {
            const s = JSON.parse(localStorage.getItem(SAVE_KEY))
            return s ? Object.assign(defaultSave(), s) : defaultSave()
          } catch (e) {
            return defaultSave()
          }
        }

        /* ================= 아이콘 (SVG) ================= */
        const sv = (p) =>
          `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`

          ),
          gear: sv(
            '<circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/>',
          ),
          coin: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffc83d" stroke="#d98f1e" stroke-width="2"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#e6a52a" stroke-width="2"/></svg>',
          bucket: sv(
            '<path d="M5 8h14l-1.6 12H6.6z"/><path d="M8 8a4 4 0 0 1 8 0"/><path d="M6.5 13h11"/>',
          ),
          boot: sv(
            '<path d="M8 3h6v8l5 3a2 2 0 0 1 1 2v3H5V3z"/><path d="M5 17h15"/>',
          ),
          toolbox: sv(
            '<rect x="3" y="8" width="18" height="12" rx="2"/><path d="M9 8V6a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 13h18"/>',
          ),
          hammer: sv(
            '<path d="M14 4l6 6-3 3-6-6z"/><path d="M12 9L4 17l3 3 8-8"/>',
          ),
          target: sv(
            '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
          ),
          clover: sv(
            '<circle cx="9" cy="9" r="3.5"/><circle cx="15" cy="9" r="3.5"/><circle cx="9" cy="15" r="3.5"/><circle cx="15" cy="15" r="3.5"/><path d="M12 14l4 7"/>',
          ),
          bolt: sv('<path d="M13 2L5 14h6l-1 8 8-12h-6z"/>'),

        const ic = (n) => ICON[n] || ""
        function fillIcons(root = document) {
          root.querySelectorAll("[data-ic]").forEach((e) => {
            e.innerHTML = ICON[e.dataset.ic] || ""

        }

        /* ================= 유틸 ================= */

                  for (let dx = -1; dx <= 1; dx++) {
                    if (!dx && !dy) continue
                    const xx = x + dx,
                      yy = y + dy
                    if (xx < 1 || yy < 1 || xx >= MW - 1 || yy >= MH - 1)
                      continue
                    const k = yy * MW + xx
                    if (
                      from[k] !== -2 ||
                      M[k] ||
                      (SOL[k] && !(DEC[k] === 36 && false))
                    )
                      continue
                    from[k] = i
                    dq.push(k)
                  }
              }
              if (hit < 0) continue
              const path = []
              for (let i = hit; i >= 0; i = from[i]) path.push(i)
              path.reverse()
              const ha = HT[path[0]],
                hb = HT[path[path.length - 1]],
                n = Math.max(1, path.length - 1)
              path.forEach((i, k) => {
                const v = lerp(ha, hb, k / n),
                  x = i % MW,
                  y = (i / MW) | 0
                for (let j = -1; j <= 1; j++)
                  for (let i2 = -1; i2 <= 1; i2++) {
                    const kk = (y + j) * MW + x + i2
                    if (!M[kk]) HT[kk] = v
                  }
              })
            }
            steep()
          }
          SHD.fill(0)
          for (let y = 1; y < MH - 1; y++)
            for (let x = 1; x < MW - 1; x++) {
              const i = y * MW + x
              SHD[i] = clamp(
                (HT[i - 1] - HT[i + 1] + (HT[i - MW] - HT[i + MW])) * 3.4,
                -0.38,
                0.38,
              )
            }
          SHD.set(boxBlur(SHD, 1, 0))
          prebake()
        })()
        function drawPaths(tc) {

            tc.fill()

            const x = Math.floor(p[0]),

            return fld(FW, p[0], p[1]) < 0.28 && !SOL[y * MW + x]

          tc.save()

                if (!ok(p)) continue
                if (pass === 0) dab(p[0], p[1], 0.66, "rgba(150,120,70,.35)")

        const clouds = Array.from({ length: 14 }, () => ({

        // 낙엽: 월드에 고정된 좌표. 카메라가 움직여도 땅에 대해 가만히 떠다니고, 화면 밖으로 나가면 반대편에서 다시 생겨요.
        const leaves = Array.from({ length: 30 }, () => ({
          x: 0,

        const afish = []
        ;(function () {
          let n = 0,

          while (n < 340 && tries < 70000) {
            tries++
            const x = rnd(0, MW),
              y = rnd(0, MH)
            if (wAt(x, y) > 0.66) {
              afish.push({
                x,
                y,
                a: rnd(0, 6.28),
                sp: rnd(0.25, 0.6),

        function updateAmbient(dt) {
          for (const c of clouds) {
            c.x += c.sp * dt
            if (c.x > MW + 10) c.x = -10
          }
          const hw = W / TS / 2 + 2.5,
            hh = H / TS / 2 + 2.5
          for (const l of leaves) {
            if (!l.init) {
              l.x = cam.x + rnd(-hw, hw)
              l.y = cam.y + rnd(-hh, hh)
              l.init = true
            }
            l.x += (0.28 + Math.sin(time * 0.7 + l.ph) * 0.22) * dt
            l.y += (0.1 + Math.cos(time * 0.9 + l.ph) * 0.08) * dt
            l.rot += l.vr * dt
            if (l.x > cam.x + hw) l.x -= 2 * hw
            else if (l.x < cam.x - hw) l.x += 2 * hw
            if (l.y > cam.y + hh) l.y -= 2 * hh
            else if (l.y < cam.y - hh) l.y += 2 * hh
          }
          for (const f of afish) {
            f.turn -= dt
            if (f.turn <= 0) {
              f.a += rnd(-0.9, 0.9)
              f.turn = rnd(0.8, 2.5)
            }
            const nx = f.x + Math.cos(f.a) * f.sp * dt * 1.4,
              ny = f.y + Math.sin(f.a) * f.sp * dt * 1.4
            if (wAt(nx, ny) > 0.6 && isSea(nx, ny) === f.sea) {
              f.x = nx
              f.y = ny

              f.turn = 1
            }

        /* ================= 낚시 상태 머신 (동물의 숲 방식) =================
   던지기 -> 찌가 떠 있음(가짜 입질은 작게 까딱) -> 찌가 푹 꺼지면 탭 -> 끌어올리기 -> 획득 */
        const F = {

        /* 낚시 스팟: 사방으로 레이를 쏴서 가장 가까운 물을 찾음 (랜덤 없음 + 이전 방향 우선) */
        let lastRay = -1
        function nearWater() {
          let best = null,
            bs = 9
          for (let k = 0; k < 24; k++) {
            const a = (k / 24) * 6.2832,
              dx = Math.cos(a),
              dy = Math.sin(a)
            let hit = -1
            for (let t = 0; t <= 1.5; t += 0.06) {
              if (isW(P.x + dx * t, P.y + dy * t)) {
                hit = t
                break
              }
            }
            if (hit < 0) continue
            const sc =
              hit - (k === lastRay ? 0.25 : 0) - 0.12 * (dx * P.fx + dy * P.fy)
            if (sc < bs) {
              bs = sc
              best = { k, dx, dy, t: hit }
            }
          }
          if (!best) {
            lastRay = -1
            return null
          }
          lastRay = best.k
          const t0 = best.t
          let tl = t0
          for (let t = t0; t <= 5; t += 0.1) {
            if (isW(P.x + best.dx * t, P.y + best.dy * t)) tl = t
            else if (t > t0 + 0.2) break
          }
          const tt = t0 + Math.max(0.4, Math.min(2, (tl - t0) * 0.8))
          let x = P.x + best.dx * tt,
            y = P.y + best.dy * tt
          if (!isW(x, y)) {
            x = P.x + best.dx * (t0 + 0.15)
            y = P.y + best.dy * (t0 + 0.15)
          }
          return {
            dx: best.dx,
            dy: best.dy,
            x,
            y,
            d: depthAt(x, y),
            wt: isSea(x, y) ? 1 : 0,
            t: tt,
            valid: true,
          }
        }
        let reachTick = 0,

        function anyWater() {
          for (let k = 0; k < 16; k++) {
            const a = (k / 16) * 6.2832
            if (rayWater(Math.cos(a), Math.sin(a)) >= 0) return true
          }
          return false
        }
        function rayWater(dx, dy, max = 9) {
          for (let t = 0.5; t <= max; t += 0.2) {
            if (isW(P.x + dx * t, P.y + dy * t)) return t

          return -1
        }
        /* 던지기 힘(ch) -> 거리 1.2~9칸. 물이 아니면 앞뒤 1칸 안에서 가까운 물로 보정, 없으면 invalid */
        function aimTarget(dx, dy, ch) {
          const tt = lerp(1.2, 9, ch) * (1 + save.gear.lc),
            x = clamp(P.x + dx * tt, 0.6, MW - 0.6),
            y = clamp(P.y + dy * tt, 0.6, MH - 0.6),

        function coBuff() {
          let n = 0
          if (MP.on && MP.user)
            for (const k in MP.others) {
              const o = MP.others[k]
              if (o.stale || !o.f || o.f > 3) continue
              if (Math.hypot(o.x - P.x, o.y - P.y) <= 7) n++
            }

        function landBobber() {
          F.bx = F.tx

          if (hk) {

          }
          if (!isW(F.tx, F.ty) && save.gear.grap && (P.grCd || 0) <= 0) {

          F.pick = rollFish(F.depth, F.wt ? "sea" : "fresh", F.zone)
          F.waitDur = rnd(7, 13) / (save.gear.bite * coBuff().bite * CFGX.bite)
          {
            const n = Math.floor(rnd(0, 4)),
              lo = Math.max(1.2, F.waitDur * 0.35),
              hi = F.waitDur - 0.3
            F.nib = Array.from({ length: n }, () => rnd(lo, hi)).sort(
              (a, b) => a - b,
            )
          }
          F.nibI = 0
          F.rippleT = 0.5
          splash(F.bx, F.by, 14, 1.1)
          sfx.splash()
          vib(15)
          let lx = F.bx,
            ly = F.by
          for (let k = 0; k < 14; k++) {
            const a = rnd(0, 6.283),
              r = rnd(2.2, 3.2),
              x = F.bx + Math.cos(a) * r,
              y = F.by + Math.sin(a) * r
            if (isW(x, y) && (isSea(x, y) ? 1 : 0) === F.wt) {
              lx = x
              ly = y
              break
            }
          }
          F.lure = {
            x0: lx,
            y0: ly,
            x: lx,
            y: ly,
            a: 0,
            sc: 0.85 + Math.random() * 0.75,
          }
        }
        function doBite() {
          F.phase = "bite"
          F.t = 0
          F.dip = 1
          splash(F.bx, F.by, 16, 1.2)
          sfx.bite()
          vib([30, 40, 70])
          shake = Math.max(shake, 0.45)
        }
        function missBite() {
          F.phase = "idle"
          F.lure = null
          ripple(F.bx, F.by, 1)
          toast("앗, 놓쳤어요… 다시 던져봐요")
          sfx.lost()
        }
        function hook() {
          if (F.phase !== "bite") return
          F.phase = "reel"
          F.t = 0
          F.lure = null
          if (joy.id !== null) releaseJoy()
          R = newRhythm(F.pick.ri)
          R.sil = new Image()
          R.sil.src = iconURL(F.pick.f, 64, true)
          splash(F.bx, F.by, 18, 1.5)
          sfx.hook()
          vib([25, 30, 25])
          shake = 0.6
        }
        /* ---- 리듬 낚시 ---- */
        const RHD = {
          bpm: [96, 108, 120, 132, 144],
          n: [6, 8, 10, 12, 15],
          pw: [0.085, 0.08, 0.07, 0.062, 0.055],
          gw: [0.17, 0.16, 0.145, 0.13, 0.12],
          dmg: [24, 26, 28, 31, 34],
          gaps: [
            [1],
            [1, 1, 1, 0.5, 0.5],
            [1, 1, 0.5, 0.5, 1.5],
            [1, 0.5, 0.5, 0.5, 1.5, 0.5],
            [0.5, 0.5, 0.5, 1, 1.5, 0.5, 0.5, 0.5],
          ],
        }
        function newRhythm(ri) {
          const gs = RHD.gaps[ri],
            n = RHD.n[ri],
            notes = []
          let b = 2,
            prev = 1
          for (let i = 0; i < n; i++) {
            notes.push({ b, res: null, rt: 0 })
            let g = gs[Math.floor(Math.random() * gs.length)]
            if (prev === 0.5 && g > 1) g = 0.5
            prev = g
            b += g
          }
          return {
            ri,
            bpm: RHD.bpm[ri],
            n,
            notes,
            beat: -1.2,
            hp: 100,
            combo: 0,
            best: 0,
            pf: 0,
            gd: 0,
            ms: 0,
            pw: RHD.pw[ri] * (1 + save.gear.zone),
            gw: RHD.gw[ri] * (1 + save.gear.zone),
            dmg: RHD.dmg[ri] / save.gear.power,
            texts: [],
            lastB: -9,
            pulse: 0,
            kv: 0,
            fin: false,
            fail: false,
            finT: 0,
            sil: null,
          }
        }
        function resolveNote(n, res) {
          const r = R
          n.res = res
          n.rt = 0
          if (res === "miss") {
            r.ms++
            r.combo = 0
            r.hp -= r.dmg * (1 - clamp(save.gear.guard || 0, 0, 0.8))
            sfx.rmiss()
            vib([30, 30])
            shake = Math.max(shake, 0.3)
            splash(F.bx, F.by, 6, 0.6)
          } else {
            r.combo++
            r.best = Math.max(r.best, r.combo)
            if (res === "perfect") {
              r.pf++
              r.hp = Math.min(100, r.hp + 4)
            } else r.gd++
            sfx.rhit(r.combo, res === "perfect")
            vib(res === "perfect" ? 14 : 8)
            r.pulse = 1
            splash(F.bx, F.by, res === "perfect" ? 8 : 4, 0.7)
            ripple(F.bx, F.by, 0.5)
          }
          r.texts.push({
            t: 0,
            txt:
              res === "perfect" ? "PERFECT!" : res === "good" ? "GOOD" : "MISS",
            col:
              res === "perfect"
                ? "#ffd23f"
                : res === "good"
                  ? "#6af09b"
                  : "#ff6a5a",
          })
          if (r.hp <= 0) {
            r.hp = 0
            r.fail = true
            r.finT = 0
          }
        }
        function rhythmTap() {
          const r = R
          if (!r || r.fail || r.fin || F.phase !== "reel") return
          const n = r.notes.find((x) => !x.res)
          if (!n) return
          const d = ((r.beat - n.b) * 60) / r.bpm,
            a = Math.abs(d)
          if (a <= r.pw) resolveNote(n, "perfect")
          else if (a <= r.gw) resolveNote(n, "good")
          else if (d < 0 && d > -(r.gw + 0.22)) resolveNote(n, "miss")
          else {
            r.hp = Math.max(1, r.hp - 3)
            sfx.tick()
          }
        }
        // 찌가 끌려올 때 물 가장자리에서 멈추게: 낚시꾼 쪽으로 물이 끝나는 지점 바로 안쪽까지만
        function reelEnd() {
          const dx = F.tx - P.x,
            dy = F.ty - P.y,
            L = Math.hypot(dx, dy) || 1,
            ux = dx / L,
            uy = dy / L
          let t = L
          while (t > 0 && isW(P.x + ux * (t - 0.1), P.y + uy * (t - 0.1)))
            t -= 0.1
          // t = 물이 시작되는 거리. 그보다 살짝 안쪽(물 위)에서 멈춘다
          t = Math.min(L, t + 0.35)
          return { x: P.x + ux * t, y: P.y + uy * t }
        }
        function updateRhythm(dt) {
          const r = R
          if (!r) return
          r.pulse = Math.max(0, r.pulse - dt * 5)
          for (const n of r.notes) if (n.res) n.rt += dt
          for (let i = r.texts.length - 1; i >= 0; i--) {
            r.texts[i].t += dt
            if (r.texts[i].t > 0.7) r.texts.splice(i, 1)
          }
          if (r.fail || r.fin) {
            r.finT += dt
            if (r.finT > 0.7) {
              if (r.fail) failReel()
              else successReel()
            }
          } else {
            r.beat += (dt * r.bpm) / 60
            const fb = Math.floor(r.beat)
            if (fb !== r.lastB) {
              r.lastB = fb
              sfx.beat(fb)
            }
            for (const n of r.notes) {
              if (n.res) continue
              if (((r.beat - n.b) * 60) / r.bpm > r.gw) {
                resolveNote(n, "miss")
                if (r.fail) break
              } else break
            }
            if (!r.fail && r.notes.every((n) => n.res)) {
              r.fin = true
              r.finT = 0
            }
          }
          const tgt = ((r.pf + r.gd) / r.n) * 0.85
          r.kv += (tgt - r.kv) * Math.min(1, dt * 6)
          if (!r.re) r.re = reelEnd()
          const kk = clamp(r.kv / 0.85, 0, 1)
          F.bx = lerp(F.tx, r.re.x, kk)
          F.by = lerp(F.ty, r.re.y, kk)
        }
        function failReel() {
          R = null
          F.phase = "idle"
          splash(F.bx, F.by, 10, 0.8)
          sfx.lost()
          vib(120)
          toast("물고기가 도망쳤어요")
        }
        function successReel() {
          const r = R
          let rank = "B",
            m = 1
          if (r.ms === 0) {
            rank = r.pf / r.n >= 0.8 ? "S" : "A"
            m = rank === "S" ? 1.3 : 1.12
          }
          F.pick.rank = rank
          F.pick.price = Math.round(F.pick.price * m)
          F.pick.combo = r.best
          R = null
          startPop()
        }
        function drawRhythm() {
          const r = R
          if (F.phase !== "reel" || !r) return
          const s = Math.max(0.9, baseTS / 52),
            ty = H * 0.7,
            hx = W * 0.2,
            pxb = (W * 0.8 + 20) / 3.4,
            hh = 40 * s
          ctx.fillStyle = "rgba(18,44,62,.6)"
          rr(8, ty - hh, W - 16, hh * 2, hh * 0.5)
          ctx.fill()
          const b0 = Math.floor(r.beat)
          ctx.strokeStyle = "rgba(255,255,255,.14)"
          ctx.lineWidth = 2
          for (let k = b0 - 1; k <= b0 + 5; k++) {
            const x = hx + (k - r.beat) * pxb
            if (x < hx + 34 * s || x > W - 18) continue
            ctx.beginPath()
            ctx.moveTo(x, ty - hh + 9)
            ctx.lineTo(x, ty + hh - 9)
            ctx.stroke()
          }
          const fr = r.beat - Math.floor(r.beat),
            pu = 1 + 0.14 * Math.pow(1 - fr, 3) + 0.12 * r.pulse
          ctx.lineWidth = 5 * s
          ctx.strokeStyle = "rgba(255,255,255,.95)"
          ctx.beginPath()
          ctx.arc(hx, ty, 27 * s * pu, 0, 6.283)
          ctx.stroke()
          ctx.fillStyle = "rgba(255,255,255,.12)"
          ctx.fill()
          const col = RAR[RORD[r.ri]].c
          for (let i = r.notes.length - 1; i >= 0; i--) {
            const n = r.notes[i],
              x = hx + (n.b - r.beat) * pxb
            if (n.res === "perfect" || n.res === "good") {
              if (n.rt < 0.35) {
                const k = n.rt / 0.35
                ctx.globalAlpha = 1 - k
                ctx.lineWidth = 4 * s
                ctx.strokeStyle = n.res === "perfect" ? "#ffd23f" : "#6af09b"
                ctx.beginPath()
                ctx.arc(hx, ty, (27 + k * 40) * s, 0, 6.283)
                ctx.stroke()
                ctx.globalAlpha = 1
              }
              continue
            }
            if (x > W + 30 || x < hx - 80 * s) continue
            if (n.res === "miss") {
              if (n.rt > 0.8) continue
              ctx.globalAlpha = 0.45 * (1 - n.rt / 0.8)
            }
            ctx.fillStyle = n.res === "miss" ? "#7b8a95" : col
            ctx.beginPath()
            ctx.arc(x, ty, 19 * s, 0, 6.283)
            ctx.fill()
            ctx.lineWidth = 3.5 * s
            ctx.strokeStyle = "#fff"
            ctx.stroke()
            ctx.fillStyle = "rgba(255,255,255,.8)"
            ctx.beginPath()
            ctx.arc(x - 5 * s, ty - 6 * s, 4 * s, 0, 6.283)
            ctx.fill()
            ctx.globalAlpha = 1
          }
          ctx.textAlign = "center"
          ctx.textBaseline = "middle"
          ctx.lineJoin = "round"
          for (const t of r.texts) {
            ctx.globalAlpha = 1 - t.t / 0.7
            ctx.font = `900 ${22 * s}px "Chiron GoRound TC",sans-serif`
            const y = ty - hh - 26 * s - t.t * 30 * s
            ctx.lineWidth = 5
            ctx.strokeStyle = "rgba(20,40,60,.85)"
            ctx.strokeText(t.txt, hx + 30 * s, y)
            ctx.fillStyle = t.col
            ctx.fillText(t.txt, hx + 30 * s, y)
          }
          ctx.globalAlpha = 1
          if (r.combo >= 2) {
            ctx.textAlign = "right"
            ctx.font = `900 ${20 * s}px "Chiron GoRound TC",sans-serif`
            ctx.lineWidth = 5
            ctx.strokeStyle = "rgba(20,40,60,.85)"
            const tx = `${r.combo} COMBO`
            ctx.strokeText(tx, W - 22, ty - hh + 22 * s)
            ctx.fillStyle = "#fff"
            ctx.fillText(tx, W - 22, ty - hh + 22 * s)
          }
          const bx = hx + 6 * s,
            bw = W * 0.46,
            bh = 12 * s,
            by = ty + hh + 16 * s
          ctx.fillStyle = "rgba(18,44,62,.6)"
          rr(bx - 4, by - 4, bw + 8, bh + 8, (bh + 8) / 2)
          ctx.fill()
          ctx.fillStyle = `hsl(${Math.round(r.hp * 1.2)},80%,55%)`
          if (r.hp > 0) {
            rr(bx, by, (bw * r.hp) / 100, bh, bh / 2)
            ctx.fill()
          }
        }
        function startPop() {
          F.phase = "pop"
          F.t = 0
          F.popFrom = { x: F.bx, y: F.by }
          F.popTo = { x: P.x + F.dx * 0.35, y: P.y + F.dy * 0.2 }
          splash(F.bx, F.by, 26, 1.8)
          sfx.splash(1.5)
          shake = 0.5
          vib([20, 20, 40])
        }
        function finishCatch() {
          const p = F.pick,
            f = p.f
          p.price = Math.max(
            1,
            Math.round(
              p.price *
                CFGX.price *
                (+CFGX.fish[f.id] > 0 ? +CFGX.fish[f.id] : 1),
            ),
          )
          let cd = save.codex[f.id]
          const isNew = !cd
          if (!cd) cd = save.codex[f.id] = { n: 0, max: 0, seen: false }
          cd.n++
          cd.max = Math.max(cd.max, p.size)
          save.inv.push({ id: f.id, size: p.size, price: p.price })
          if (Math.random() < (save.gear.twin || 0)) {
            cd.n++
            save.inv.push({
              id: f.id,
              size: Math.round(p.size * rnd(0.8, 1) * 10) / 10,
              price: Math.round(p.price * 0.9),
            })
            toast("쌍걸이! 한 마리 더", 1500)
          }
          persist()
          updateHud()
          updateDexDot()
          mpFeed(p)
          mpCatch(p)
          showCard(p, isNew)
          sparkBurst(P.x, P.y, p.ri)
          sfx.jingle(p.ri)
          vib(p.ri >= 3 ? [60, 40, 60, 40, 120] : p.ri >= 1 ? [40, 30, 40] : 30)
          if (p.ri >= 4) {
            const fl = $("#flash")
            fl.classList.remove("go")
            void fl.offsetWidth
            fl.classList.add("go")
          }
          F.phase = "idle"
        }
        function updateFishing(dt) {
          if (P.grCd > 0) P.grCd -= dt
          F.dip = Math.max(0, F.dip - dt * 3.5)
          switch (F.phase) {
            case "windup":
              F.t += dt
              if (F.t >= 0.28) {
                F.phase = "flight"
                F.t = 0
                sfx.whoosh()
              }
              break
            case "charge": {
              F.chT += dt
              F.ch = Math.min(1, F.chT / 1.5)
              const jm = Math.hypot(joy.x, joy.y)
              if (jm > 0.3) {
                const nx = joy.x / jm,
                  ny = joy.y / jm
                F.aim = { dx: nx, dy: ny }
              }
              F.dx = F.aim.dx
              F.dy = F.aim.dy
              if (Math.floor(F.chT * 10) !== Math.floor((F.chT - dt) * 10))
                sfx.charge(F.ch)
              break
            }
            case "flight":
              F.t += dt
              if (F.t >= F.fl) landBobber()
              break
            case "ground":
              F.t += dt
              if (F.gr) {
                const dx = F.gr.x - P.x,
                  dy = F.gr.y - P.y,
                  L = Math.hypot(dx, dy),
                  st = Math.min(L, dt * 17)
                if (
                  L < 0.2 ||
                  solidPt(P.x + (dx / L) * st, P.y + (dy / L) * st)
                ) {
                  F.gr = null
                  P.grCd = 4
                  P.vx = P.vy = 0
                  F.phase = "idle"
                  break
                }
                P.x += (dx / L) * st
                P.y += (dy / L) * st
                P.vx = (dx / L) * 14
                P.vy = (dy / L) * 14
                if (Math.random() < 0.6)
                  emit({
                    kind: "d",
                    x: P.x,
                    y: P.y,
                    z: 0.1,
                    vz: rnd(0.2, 0.6),
                    vx: rnd(-0.3, 0.3),
                    vy: rnd(-0.2, 0.2),
                    max: 0.5,
                    col: "#e9dcb8",
                    sz: rnd(2, 3.5),
                    g: 0,
                  })
                break
              }
              if (F.t > 0.8) {
                F.phase = "idle"
              }
              break
            case "drag": {
              F.t += dt
              F.pt -= dt
              const o = MP.others[F.hk]
              if (!o || o.stale) {
                endDrag("줄이 풀렸어요")
                break
              }
              F.bx = o.x
              F.by = o.y
              const dx = o.x - P.x,
                dy = o.y - P.y,
                d = Math.hypot(dx, dy) || 1
              F.dx = dx / d
              F.dy = dy / d
              if (F.pull && F.pt <= 0) {
                F.pt = 0.3
                sendEvent(F.hk, "pull", {
                  px: +P.x.toFixed(2),
                  py: +P.y.toFixed(2),
                })
              }
              if (d < 1.3) {
                endDrag(o.n + "님을 끌어왔어요!", true)
              } else if (F.t > 30) {
                endDrag("놓쳤어요… 시간이 지났어요")
              }
              break
            }
            case "wait": {
              F.t += dt
              F.rippleT -= dt
              if (F.rippleT <= 0) {
                ripple(F.bx, F.by, 0.35)
                F.rippleT = rnd(0.9, 1.5)
              }
              const L = F.lure
              if (L) {
                const d0 = F.waitDur * 0.32,
                  k = clamp((F.t - d0) / (F.waitDur - 0.95 - d0), 0, 1),
                  e = eOut(k),
                  wob = Math.sin(F.t * 3) * (1 - k) * 0.5
                L.x = lerp(L.x0, F.bx, e) - F.dy * wob
                L.y = lerp(L.y0, F.by, e) + F.dx * wob
                L.a =
                  Math.atan2(F.by - L.y, F.bx - L.x) + (k >= 1 ? F.t * 2.2 : 0)
              }
              while (F.nibI < F.nib.length && F.t >= F.nib[F.nibI]) {
                F.nibI++
                F.dip = 0.4
                ripple(F.bx, F.by, 0.45)
                sfx.tick()
                vib(8)
              }
              if (F.t >= F.waitDur) doBite()
              break
            }
            case "bite":
              F.t += dt
              F.dip = F.t < 0.5 ? 0.85 + 0.15 * Math.sin(F.t * 40) : 0.7
              if (F.t >= F.hookWin) missBite()
              break
            case "reel":
              F.t += dt
              updateRhythm(dt)
              break
            case "pop":
              F.t += dt
              if (Math.random() < dt * 40)
                emit({
                  kind: "s",
                  x: lerp(F.popFrom.x, F.popTo.x, F.t / 0.85),
                  y: lerp(F.popFrom.y, F.popTo.y, F.t / 0.85),
                  z: 1 + Math.sin((F.t / 0.85) * Math.PI) * 1.2,
                  vx: rnd(-0.5, 0.5),
                  vy: rnd(-0.3, 0.3),
                  vz: rnd(0, 1),
                  max: 0.5,
                  col: RAR[RORD[F.pick.ri]].c,
                  sz: rnd(2, 4),
                  g: 3,
                })
              if (F.t >= 0.85) finishCatch()
              break
          }
        }

        /* ================= 플레이어 / 메인 업데이트 ================= */
        function solidPt(x, y) {
          if (x < 0.2 || y < 0.2 || x > MW - 0.2 || y > MH - 0.2) return true
          const ix = Math.floor(x),
            iy = Math.floor(y),
            k = iy * MW + ix
          if (SOL[k]) return true
          const d = DEC[k]
          if (!SOLID[d]) return false
          const fx = x - ix - 0.5,
            fy = y - iy - 0.78,
            r = SRAD[d] || 0.16
          return fx * fx + fy * fy < r * r
        }
        const SRAD = {
          27: 0.12,
          29: 0.1,
          1: 0.035,
          7: 0.03,
          8: 0.03,
          9: 0.035,
          10: 0.035,
          11: 0.03,
          3: 0.16,
          15: 0.24,
          13: 0.14,
          14: 0.14,
          18: 0.12,
          22: 0.09,
          24: 0.05,
        }
        function blocked(x, y) {
          const hw = 0.07,
            hh = 0.04
          return (
            solidPt(x - hw, y - hh) ||
            solidPt(x + hw, y - hh) ||
            solidPt(x - hw, y + hh) ||
            solidPt(x + hw, y + hh)
          )
        }
        function moveAxis(dx, dy) {
          const nx = P.x + dx,
            ny = P.y + dy
          if (!blocked(nx, ny) || blocked(P.x, P.y)) {
            P.x = nx
            P.y = ny
            return
          }
          /* 모서리 슬라이드: 막히면 수직 방향으로 살짝 비켜서 지나가요 */
          const px = dy ? 1 : 0,
            py = dx ? 1 : 0
          for (const o of [0.04, -0.04, 0.08, -0.08]) {
            const ax = nx + px * o,
              ay = ny + py * o
            if (!blocked(ax, ay)) {
              P.x = ax
              P.y = ay
              return
            }
          }
          if (dx) P.vx = 0
          if (dy) P.vy = 0
        }

        /* --- 펫: 뒤에서 졸졸 따라와요 --- */
        const PET = { x: 0, y: 0, hop: 0, vh: 0, ph: 0, init: false, last: "" }
        function petFollow(pt, tx, ty, dt, moving) {
          const dx = tx - pt.x,
            dy = ty - pt.y,
            d = Math.hypot(dx, dy)
          if (d > 6) {
            pt.x = tx
            pt.y = ty
            return
          }
          const k = 1 - Math.exp(-(d > 1.6 ? 7 : 4) * dt)
          pt.x += dx * k

        function bobberScreen() {
          if (F.phase === "flight") {
            const f = clamp(F.t / F.fl, 0, 1),
              wx = lerp(P.x, F.tx, f),
              wy = lerp(P.y, F.ty, f),
